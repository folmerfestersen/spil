<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Støvverden</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: verden fylder skærmen, øverst et smalt banner med rigerne, nederst en trædock med faner og ikonknapper som i et eventyrspil. */
  --ink:#120d0a;
  --wood:#3a2819;
  --wood-dark:#241810;
  --wood-light:#5a3f27;
  --gold:#e3b653;
  --parch:#ecd9ad;
  --parch-ink:#3a2819;
  --text:#f3e8cf;
  --muted:#b9a482;
  --war:#ff8a70;
  --display:'Pixelify Sans',ui-monospace,Menlo,monospace;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:100%;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:7px 16px;background:linear-gradient(var(--wood),var(--wood-dark));border-bottom:2px solid var(--gold);box-shadow:0 2px 0 #000}
h1{font-family:var(--display);font-size:23px;font-weight:700;margin:0;color:var(--gold);letter-spacing:1px;text-shadow:0 2px 0 #000}
.stats{display:flex;gap:4px 14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;font-family:var(--display);font-size:14px}
.stats b{color:var(--text);font-weight:500}
#sAge{color:var(--gold)}
.ctrl{margin-left:auto;display:flex;gap:6px}
button{font:inherit;color:var(--text);cursor:pointer}
.btn{font-family:var(--display);background:linear-gradient(var(--wood-light),var(--wood));border:2px solid #1a110a;box-shadow:inset 0 1px 0 rgba(255,220,150,.25),0 2px 0 #000;border-radius:5px;padding:5px 11px}
.btn:hover{filter:brightness(1.18)}
.btn[aria-pressed="true"]{background:linear-gradient(#b98a35,#8a6424);color:#1a110a}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#kds{display:flex;gap:8px;padding:5px 16px;overflow-x:auto;min-height:34px;align-items:center;background:var(--wood-dark);border-bottom:1px solid #000;color:var(--muted);white-space:nowrap;font-size:13px}
.kd{display:inline-flex;gap:7px;align-items:center;padding:2px 10px;border:1px solid var(--wood-light);background:rgba(0,0,0,.25);border-radius:4px;color:var(--text);font-variant-numeric:tabular-nums}
.kd b{font-family:var(--display);font-weight:500}
.kd span{color:var(--muted)}
.kd em{font-style:normal;color:var(--war)}
.dot{width:9px;height:11px;flex:none;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
#stage{position:relative;min-height:0;min-width:0;background:#05060d;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
#log{position:absolute;left:12px;top:10px;max-width:55%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;font-size:12.5px}
#log div{background:rgba(236,217,173,.93);color:var(--parch-ink);padding:2px 9px;border-radius:3px;border-left:3px solid #8a6424;font-weight:500}
#insp{position:absolute;right:12px;top:10px;width:236px;max-width:62%;background:var(--parch);color:var(--parch-ink);border:2px solid #8a6424;box-shadow:0 3px 0 rgba(0,0,0,.5);border-radius:6px;padding:9px 12px;font-size:13px;line-height:1.5}
#insp[hidden]{display:none}
#insp h3{font-family:var(--display);font-size:17px;margin:0 22px 0 0}
#insp p{margin:0}
#inspX{position:absolute;right:5px;top:4px;background:none;border:0;color:var(--parch-ink);font-size:18px;line-height:20px;padding:0 6px}
.hp{height:7px;border-radius:2px;background:#b9a482;margin:5px 0;overflow:hidden;border:1px solid #8a6424}
.hp i{display:block;height:100%;background:#4f9a55}
#hov{position:absolute;left:12px;bottom:10px;background:rgba(18,13,10,.82);border:1px solid var(--wood-light);border-radius:4px;padding:2px 9px;font-family:var(--display);font-size:13px;pointer-events:none}
#hov:empty{display:none}
#view{position:absolute;right:12px;bottom:10px;display:flex;align-items:flex-end;gap:6px}
#zoom{display:flex;flex-direction:column;gap:4px}
#zoom .btn{width:32px;height:30px;padding:0;font-size:17px;line-height:1}
#mini{display:block;width:168px;border:2px solid var(--gold);box-shadow:0 0 0 2px #000;border-radius:3px;image-rendering:pixelated;cursor:pointer;touch-action:none;background:#000}
#dock{background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 118px,rgba(0,0,0,.22) 118px 120px),linear-gradient(var(--wood),var(--wood-dark));border-top:3px solid var(--gold);box-shadow:0 -2px 0 #000;display:flex;flex-direction:column;min-height:0;max-height:44vh}
#tabs{display:flex;gap:3px;padding:0 12px;margin-top:-1px;overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:13.5px;white-space:nowrap;padding:5px 11px 6px;background:var(--wood-dark);border:2px solid #1a110a;border-top:0;border-radius:0 0 7px 7px;color:var(--muted)}
.tab canvas,.tool canvas{image-rendering:pixelated;flex:none}
.tab canvas{width:16px;height:16px}
.tab[aria-selected="true"]{background:var(--parch);color:var(--parch-ink);padding-bottom:8px}
#tray{display:flex;gap:10px;padding:8px 12px 6px;min-height:0;flex:1}
#fixed{display:flex;flex-direction:column;gap:6px;flex:none;width:150px;padding-right:10px;border-right:2px solid rgba(0,0,0,.35)}
.brush{display:flex;align-items:center;gap:6px;color:var(--muted);font-family:var(--display);font-size:13px}
.brush input{flex:1;min-width:0;accent-color:var(--gold)}
.brush output{color:var(--text);width:2ch;text-align:right}
#fixtools{display:flex;gap:5px}
#panel{flex:1;min-width:0;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px}
.tool{width:66px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px 2px;font-family:var(--display);font-size:11px;line-height:1.05;text-align:center;background:linear-gradient(#4a3524,#2c1e13);border:2px solid #1a110a;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,220,150,.2),inset 0 -2px 0 rgba(0,0,0,.35),0 2px 0 #000;overflow:hidden}
.tool canvas{width:28px;height:28px}
.tool span{max-width:100%;overflow-wrap:anywhere}
.tool:hover{filter:brightness(1.2);transform:translateY(-1px)}
.tool[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(#6b4b22,#3d2a14);box-shadow:0 0 0 1px var(--gold),0 0 10px rgba(227,182,83,.55)}
#fixtools .tool{width:44px;height:44px}
#fixtools .tool span{display:none}
.sep{flex:none;align-self:stretch;display:flex;align-items:center;font-family:var(--display);font-size:11.5px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;writing-mode:vertical-rl;transform:rotate(180deg);padding:0 1px;height:56px}
.wgrp{display:flex;flex-direction:column;gap:5px;margin-right:14px}
.wgrp h2{font-family:var(--display);font-size:12px;font-weight:500;color:var(--gold);margin:0;text-transform:uppercase;letter-spacing:1px}
.wgrp div{display:flex;gap:5px;flex-wrap:wrap}
#tip{flex:none;margin:0;padding:4px 14px 6px;background:var(--parch);color:var(--parch-ink);font-size:13px;min-height:28px;border-top:2px solid #8a6424}
#tip b{font-family:var(--display);font-weight:700}
@media (max-width:760px){
  #fixed{width:104px;padding-right:8px}
  #fixtools{flex-wrap:wrap}
  .tool{width:64px;height:54px;font-size:10px}
  #dock{max-height:38vh}
  #mini{width:104px}
  h1{font-size:19px}
  #log{max-width:70%}
}
@media (prefers-reduced-motion:reduce){.tool:hover{transform:none}}
</style>
</head>
<body>
<header>
  <h1>Støvverden</h1>
  <div class="stats">
    <span>År <b id="sYear">0</b></span>
    <span><b id="sAge">Solens tid</b></span>
    <span>Folk <b id="sPop">0</b></span>
    <span>Huse <b id="sHouse">0</b></span>
    <span>Dyr <b id="sAnim">0</b></span>
  </div>
  <div class="ctrl">
    <button id="bPause" class="btn" type="button">Pause</button>
    <button id="bSpeed" class="btn" type="button">Fart 1×</button>
  </div>
</header>
<div id="kds" aria-live="polite"></div>
<main id="stage">
  <canvas id="cv" tabindex="0" aria-label="Verden. Tegn med mus eller finger, zoom med hjulet eller to fingre."></canvas>
  <div id="log"></div>
  <div id="insp" hidden><button id="inspX" type="button" aria-label="Luk">×</button><h3 id="iName"></h3><p id="iSub"></p><div class="hp"><i id="iHp"></i></div><p id="iStat"></p><p id="iTrait"></p></div>
  <div id="hov"></div>
  <div id="view">
    <div id="zoom"><button class="btn" id="zIn" type="button" aria-label="Zoom ind">+</button><button class="btn" id="zOut" type="button" aria-label="Zoom ud">−</button><button class="btn" id="zFit" type="button" aria-label="Vis hele verden">□</button></div>
    <canvas id="mini" width="168" height="84" aria-label="Verdenskort. Klik for at flytte udsnittet."></canvas>
  </div>
</main>
<footer id="dock">
  <div id="tabs" role="tablist"></div>
  <div id="tray">
    <div id="fixed">
      <label class="brush" for="brush">Pensel<input id="brush" type="range" min="0" max="12" value="3"><output id="brushOut" for="brush">3</output></label>
      <div id="fixtools"></div>
    </div>
    <div id="panel"></div>
  </div>
  <p id="tip"></p>
</footer>
<script>
(()=>{
'use strict';
const R=Math.random,ri=n=>(R()*n)|0,clamp=(v,a,b)=>v<a?a:v>b?b:v;
/* ================= Grundstoffer ================= */
const EMPTY=0,SAND=1,WATER=2,STONE=3,EARTH=4,GRASS=5,WOOD=6,TRUNK=7,PLANT=8,SEED=9,FIRE=10,SMOKE=11,STEAM=12,LAVA=13,OIL=14,ACID=15,ICE=16,GUNP=17,ASH=18,WALL=19,PLANK=20,ROOF=21,SNOW=22,SALT=23,GLASS=24,MUD=25,GRAVEL=26,COAL=27,GOLD=28,METAL=29,OBSID=30,GAS=31,CLOUD=32,NITRO=33,MERC=34,TNT=35,FUSE=36,TORCH=37,SPOUT=38,CLONE=39,VOID=40,SPONGE=41,CRYSTAL=42,FLOWER=43,WHEAT=44,KELP=45,FIREWORK=46,URAN=47,BRICK=48,NAPALM=49,BONE=50,THERM=51,MOLD=52,NT=53;
const X_PINE=NT,X_ROOF=NT+1,X_PLANKD=NT+9,X_PLANKL=NT+10,X_PLANKS=NT+11,X_FLOW=NT+12,X_WHEAT=NT+16,NX=NT+20;
// id, navn, farve, massefylde, antændelighed, brændetid
const SPEC=[[SAND,'Sand','#dcb96a',5],[WATER,'Vand','#2f7fd6',2],[STONE,'Sten','#787b88',9],[EARTH,'Jord','#6b4a32',5],[GRASS,'Græs','#5fb048',5],[WOOD,'Træ','#9a6a3c',9,.04,60],[TRUNK,'Træstamme','#6e4a2a',9,.04,60],[PLANT,'Løv','#35a04f',9,.14,12],[SEED,'Frø','#c9d36b',5,.2,8],[FIRE,'Ild','#ff8a1e',0],[SMOKE,'Røg','#4a4b55',0],[STEAM,'Damp','#d4e0ea',0],[LAVA,'Lava','#ff6a1a',3],[OIL,'Olie','#3a2a36',1,.25,14],[ACID,'Syre','#b6f23a',2],[ICE,'Is','#a8e0f5',9],[GUNP,'Krudt','#44444c',5,1,0],[ASH,'Aske','#9a9590',5],[WALL,'Mur','#3a3d4d',9],[PLANK,'Hus','#b98a55',9,.05,50],[ROOF,'Tag','#e5484d',9,.06,40],[SNOW,'Sne','#eef4fa',5],[SALT,'Salt','#f3efe6',5],[GLASS,'Glas','#bfe6ea',9],[MUD,'Mudder','#4f3a2a',5],[GRAVEL,'Grus','#948d80',5],[COAL,'Kul','#22222a',9,.02,200],[GOLD,'Guld','#f0c23c',9],[METAL,'Metal','#9aa3b5',9],[OBSID,'Obsidian','#2a2338',9],[GAS,'Gas','#9fd6a8',0,.9,5],[CLOUD,'Sky','#f2f5fa',0],[NITRO,'Nitroglycerin','#d8e86a',2,1,0],[MERC,'Kviksølv','#c9ccd6',6],[TNT,'Dynamit','#c8372f',9,.8,0],[FUSE,'Lunte','#7a6a4a',9,.08,6],[TORCH,'Fakkel','#8a5a2a',9],[SPOUT,'Kilde','#3a6ea8',9],[CLONE,'Kloner','#b05ad6',9],[VOID,'Sort hul','#0a0612',9],[SPONGE,'Svamp','#e2c84a',9],[CRYSTAL,'Krystal','#7ff0e6',9],[FLOWER,'Blomst','#f06aa8',9,.2,6],[WHEAT,'Hvede','#d8c25a',9,.2,8],[KELP,'Tang','#2f8a5a',9],[FIREWORK,'Fyrværkeri','#e85a9a',5,1,0],[URAN,'Uran','#6ae04a',9],[BRICK,'Mursten','#a8553f',9],[NAPALM,'Napalm','#e8703a',1,.7,90],[BONE,'Knogler','#e6e0cf',5],[THERM,'Termit','#b0563a',5,.3,45],[MOLD,'Skimmel','#8fae8a',9,.3,6]];
const HEX=[],NAME=['Luft'],DENS=new Uint8Array(NT),FLAM=new Float32Array(NT),BURN=new Uint8Array(NT);
SPEC.forEach(a=>{NAME[a[0]]=a[1];HEX[a[0]]=a[2];DENS[a[0]]=a[3];FLAM[a[0]]=a[4]||0;BURN[a[0]]=a[5]||0;});
const flag=l=>{const f=new Uint8Array(NT);l.forEach(t=>f[t]=1);return f;};
const PASSL=[EMPTY,SMOKE,STEAM,GAS,CLOUD,WATER,OIL,NAPALM,NITRO,PLANT,TRUNK,PLANK,ROOF,SEED,FLOWER,WHEAT,KELP,MOLD];
const PASS=flag(PASSL),PASSD=flag(PASSL.concat([FIRE,LAVA]));
const LIQ=flag([WATER,OIL,NAPALM,NITRO]),LIQK=flag([WATER,OIL,ACID,LAVA,NITRO,MERC,NAPALM]);
const DEADLY=flag([FIRE,LAVA,ACID,MERC]);
const ACTIVE=flag([SAND,WATER,EARTH,GRASS,SEED,FIRE,SMOKE,STEAM,LAVA,OIL,ACID,GUNP,ASH,SNOW,SALT,MUD,GRAVEL,GAS,CLOUD,NITRO,MERC,TORCH,SPOUT,CLONE,VOID,FIREWORK,URAN,NAPALM,BONE,THERM,MOLD]);
const OPAQ=flag([STONE,EARTH,GRASS,SAND,GRAVEL,MUD,OBSID,WALL,BRICK,COAL,GOLD,METAL,SNOW,ASH,URAN,SALT,ICE]);
const GASK=flag([SMOKE,STEAM,GAS,CLOUD]),SOFT=flag([EMPTY,SMOKE,STEAM,GAS,CLOUD]);
const NOACID=flag([EMPTY,ACID,WALL,WATER,FIRE,SMOKE,STEAM,GAS,CLOUD,GLASS,VOID,OBSID,GOLD]);
const ASHY=flag([WOOD,TRUNK,PLANK,ROOF,COAL]);
const GROUND=flag([STONE,EARTH,GRASS,SAND,GRAVEL,MUD,OBSID,WALL,BRICK,COAL,GOLD,METAL,SNOW,ASH,SALT,ICE,WOOD,GLASS]);
const DIG=flag([STONE,EARTH,GRASS,GRAVEL,COAL,GOLD,SAND,MUD,SNOW,ASH,ICE]);
const VEG=flag([PLANT,FLOWER,WHEAT,SEED,TRUNK,MOLD]);
const MOLDY=flag([WOOD,TRUNK,PLANT,PLANK,ROOF,WHEAT,FLOWER,KELP,BONE,SEED]);
const MELT=flag([METAL,STONE,BRICK,GLASS,OBSID,GRAVEL,SAND]);
const BOOM=new Uint8Array(NT);BOOM[GUNP]=3;BOOM[NITRO]=5;BOOM[TNT]=6;

const rgb=(r,g,b)=>(255<<24|b<<16|g<<8|r)>>>0;
const hx=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const hc=h=>{const c=hx(h);return rgb(c[0],c[1],c[2]);};
function mix(a,b,t){const u=1-t;return (255<<24|((a>>16&255)*u+(b>>16&255)*t)<<16|((a>>8&255)*u+(b>>8&255)*t)<<8|((a&255)*u+(b&255)*t))>>>0;}
const KHEX=['#e5484d','#3e8ef7','#f2c230','#b06be0','#f08a2b','#39c6b5','#ef6fb0','#e9e6da'];
const XHEX=['#1f6e3c'].concat(KHEX,['#5e4630','#d8c39a','#8a8c96','#f06aa8','#f6d04a','#f4f1ea','#9a7af0','#6fb04a','#9cba4a','#c8c050','#e2bd4c']);
const PALL=new Uint32Array(NX*8*16);
for(let t=1;t<NX;t++){const c=hx(t<NT?HEX[t]:XHEX[t-NT]);for(let s=0;s<8;s++)for(let L=0;L<16;L++){const f=(.86+.035*s)*(.4+L*.05);PALL[((t*8+s)<<4)+L]=rgb(Math.min(255,c[0]*f|0),Math.min(255,c[1]*f|0),Math.min(255,c[2]*f|0));}}
const FIREC=[rgb(190,50,20),rgb(224,64,26),rgb(255,122,30),rgb(255,160,40),rgb(255,210,74),rgb(255,236,150)];
const LAVAC=[rgb(255,96,20),rgb(255,120,28),rgb(255,150,40),rgb(240,80,16),rgb(255,180,60),rgb(230,70,14),rgb(255,110,24),rgb(255,136,34)];
const FWC=['#ff5a7a','#ffd24a','#6ae0ff','#9aff7a','#d48aff','#ffffff'].map(hc);
const C_WINDOW=rgb(255,216,112),C_WINDAY=rgb(150,190,214),C_DOOR=rgb(74,48,32),C_BOLT=rgb(235,245,255),C_STAR=rgb(230,230,255),C_SUN=rgb(255,244,190),C_MOON=rgb(224,230,245),C_MOON2=rgb(190,198,220),C_CAVE=rgb(22,18,30),C_WHITE=rgb(255,255,255);
const CDL=new Uint8Array(256),LDL=new Uint8Array(64);
for(let d=0;d<256;d++)CDL[d]=d===1?15:d<4?12:Math.max(5,12-((d-3)>>2));
for(let d=0;d<64;d++)LDL[d]=Math.max(6,13-(d/3|0));

/* ================= Tilstand ================= */
const SIZES=[['Lille',340,170],['Mellem',520,250],['Stor',760,340],['Enorm',1100,460]];
let sizeIx=1;
let W=340,H=170,N=0,F=1,T,D,S,M,sky,skyM1,skyM2,bgm1,bgm2,cd,ld,isSky,stars=[];
let img,pix32,gimg,glow32;
let tick=0,stamp=0,clock=0,night=0,shake=0,flash=0,wind=1,cloudBand=20,MAXE=460;
let ents=[],houses=[],growers=[],bolts=[],meteors=[],debris=[],parts=[],rockets=[],booms=[],tornados=[],quakes=[],volcanos=[],charged=[];
const kds=new Map(),wars=new Set();let kdSeq=0,entSeq=0,inspected=null;
const laws={war:true,ages:true,doom:false};
const A_SUN=0,A_RAIN=1,A_ICE=2,A_DARK=3,A_ASH=4,A_HOPE=5;
const AGES=[{n:'Solens tid',top:[86,160,222],bot:[190,226,244]},{n:'Regnens tid',top:[84,104,130],bot:[158,172,188]},{n:'Istiden',top:[150,185,215],bot:[226,238,248]},{n:'Mørkets tid',top:[36,22,56],bot:[78,48,88]},{n:'Askens tid',top:[118,68,50],bot:[204,142,92]},{n:'Håbets tid',top:[104,168,236],bot:[255,226,192]}];
let age=A_SUN,ageT=0;
const DAYLEN=5400,YEAR=600,AGELEN=9000,AIR=240,HALLCOST=14;

function alloc(w,h){W=w;H=h;N=W*H;F=N/58000;MAXE=clamp(Math.round(N/270),320,1500);
  T=new Uint8Array(N);D=new Uint8Array(N);S=new Uint8Array(N);M=new Uint8Array(N);isSky=new Uint8Array(N);
  sky=new Uint32Array(H);skyM1=new Uint32Array(H);skyM2=new Uint32Array(H);bgm1=new Int16Array(W);bgm2=new Int16Array(W);cd=new Uint16Array(W);ld=new Uint16Array(W);
  cloudBand=Math.round(H*.13);stars=[];for(let k=0;k<N/650;k++)stars.push(ri(W)+ri(H*.6|0)*W);}
function setc(i,t){T[i]=t;S[i]=ri(250);D[i]=t===FIRE?8+ri(10):t===SMOKE?50+ri(90):t===STEAM?110+ri(130):t===CLOUD?60:t===WHEAT?ri(4):0;M[i]=stamp;}
function swap(i,j){let a=T[i];T[i]=T[j];T[j]=a;a=D[i];D[i]=D[j];D[j]=a;a=S[i];S[i]=S[j];S[j]=a;M[i]=stamp;M[j]=stamp;}
function nb(x,y,i){const r=ri(4);if(r===0)return y>0?i-W:-1;if(r===1)return y<H-1?i+W:-1;if(r===2)return x>0?i-1:-1;return x<W-1?i+1:-1;}
const NB=new Int32Array(4);
function nbs(x,y,i){let n=0;if(y>0)NB[n++]=i-W;if(y<H-1)NB[n++]=i+W;if(x>0)NB[n++]=i-1;if(x<W-1)NB[n++]=i+1;return n;}
function surf(x){for(let y=4;y<H;y++)if(OPAQ[T[y*W+x]])return y;return H-1;}
function spark(x,y,n,c,sp){for(let k=0;k<n&&parts.length<1600;k++){const a=R()*6.283,v=(.3+R())*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.4,life:14+ri(26),c});}}

/* ================= Partikelfysik ================= */
function powder(x,y,i){
  if(y>=H-1)return false;
  const b=i+W,bt=T[b];
  if(DENS[bt]<5){if(DENS[bt]>0&&R()<.3)return true;swap(i,b);return true;}
  const d=R()<.5?-1:1;let nx=x+d;
  if(nx>=0&&nx<W&&DENS[T[b+d]]<5&&DENS[T[i+d]]<5){swap(i,b+d);return true;}
  nx=x-d;
  if(nx>=0&&nx<W&&DENS[T[b-d]]<5&&DENS[T[i-d]]<5){swap(i,b-d);return true;}
  return false;
}
// Tunge pulvere (jord, grus, mudder): falder lige ned og skrider kun på stejle skrænter
function heavy(x,y,i){
  if(y>=H-1)return;
  const b=i+W,bt=T[b];
  if(DENS[bt]<5){if(DENS[bt]>0&&R()<.3)return;swap(i,b);return;}
  if(y>=H-2||R()<.6)return;
  const d=R()<.5?-1:1,nx=x+d;if(nx<0||nx>=W)return;
  if(DENS[T[i+d]]<5&&DENS[T[b+d]]<5&&DENS[T[b+W+d]]<5)swap(i,b+d);
}
function liquid(x,y,i,dn,disp){
  const d=R()<.5?-1:1;
  if(y<H-1){
    const b=i+W;
    if(DENS[T[b]]<dn){swap(i,b);return;}
    let nx=x+d;if(nx>=0&&nx<W&&DENS[T[b+d]]<dn&&DENS[T[i+d]]<dn){swap(i,b+d);return;}
    nx=x-d;if(nx>=0&&nx<W&&DENS[T[b-d]]<dn&&DENS[T[i-d]]<dn){swap(i,b-d);return;}
  }
  for(let p=0;p<2;p++){
    const dd=p?-d:d;let tgt=-1;
    for(let s=1;s<=disp;s++){const nx=x+dd*s;if(nx<0||nx>=W)break;const c=i+dd*s;if(DENS[T[c]]<dn)tgt=c;else break;}
    if(tgt>=0){swap(i,tgt);return;}
  }
}
function gas(x,y,i,t){
  if(t!==GAS){
    const L=D[i]-1;
    if(L<=0){if(t===STEAM&&R()<.6){T[i]=WATER;D[i]=1;M[i]=stamp;}else T[i]=EMPTY;return;}
    D[i]=L;
    if(t===STEAM&&y<cloudBand&&R()<.03){T[i]=CLOUD;D[i]=60;M[i]=stamp;return;}
  }
  if(R()<.2)return;
  const d=R()<.5?-1:1,nx=x+d;
  if(y>0){const u=i-W;if(T[u]===EMPTY){swap(i,u);return;}if(nx>=0&&nx<W&&T[u+d]===EMPTY){swap(i,u+d);return;}}
  if(nx>=0&&nx<W&&T[i+d]===EMPTY)swap(i,i+d);
}
function cloud(x,y,i){
  const r=R();
  if(r<(age===A_RAIN?.004:.0012)){if(D[i]>=60&&y<H-1&&T[i+W]===EMPTY){setc(i+W,age===A_ICE?SNOW:WATER);D[i+W]=1;T[i]=EMPTY;}return;}
  if(r>.9997){T[i]=EMPTY;return;}
  if(r>.2&&r<.2+(age===A_RAIN?.000003:.0000003)&&D[i]>=60){bolt(x,y+1);return;}
  if(r>.75){
    if(y>cloudBand){if(T[i-W]===EMPTY)swap(i,i-W);}
    else if(y<2){if(T[i+W]===EMPTY)swap(i,i+W);}
    else{const nx=x+wind;if(nx<0||nx>=W){T[i]=EMPTY;return;}if(T[i+wind]===EMPTY)swap(i,i+wind);else if(r>.93&&T[i-W]===EMPTY)swap(i,i-W);}
  }
}
function ignite(j){
  const nt=T[j];
  if(BOOM[nt]){T[j]=EMPTY;if(booms.length<180)booms.push(j%W,(j/W)|0,BOOM[nt]);return;}
  if(nt===FIREWORK){T[j]=EMPTY;rockets.push({x:j%W,y:(j/W)|0,life:16+ri(24),h:ri(FWC.length)});return;}
  if(nt===GRASS){T[j]=EARTH;const u=j-W;if(u>=0&&T[u]===EMPTY)setc(u,FIRE);return;}
  if(nt===PLANK&&D[j]>=8)return;
  T[j]=FIRE;D[j]=Math.min(250,BURN[nt]+ri(BURN[nt]*.6+1));S[j]=nt===THERM?254:ASHY[nt]?255:0;M[j]=stamp;
}
function fire(x,y,i){
  const n=nbs(x,y,i),hot=S[i]===254;
  for(let k=0;k<n;k++){const j=NB[k],nt=T[j];
    if(nt===WATER&&!hot){setc(i,STEAM);return;}
    if(FLAM[nt]>0){if(R()<FLAM[nt]){ignite(j);if(nt===GAS&&R()<.03&&booms.length<180)booms.push(x,y,2);}}
    else if((nt===ICE||nt===SNOW)&&R()<.1){T[j]=WATER;D[j]=0;M[j]=stamp;}
    else if(hot&&MELT[nt]&&R()<.25)setc(j,LAVA);
  }
  if(T[i]!==FIRE)return;
  const L=D[i]-1;
  if(L<=0){const r=R();if(S[i]===255&&r<.3)setc(i,ASH);else if(r<.55)setc(i,SMOKE);else T[i]=EMPTY;return;}
  D[i]=L;
  if(y>0&&L>3&&T[i-W]===EMPTY&&R()<.35){const u=i-W;T[u]=FIRE;D[u]=Math.min(L-2,2+ri(4));S[u]=0;M[u]=stamp;}
}
function lava(x,y,i){
  const n=nbs(x,y,i);
  for(let k=0;k<n;k++){const j=NB[k],nt=T[j];
    if(nt===WATER){setc(j,STEAM);T[i]=R()<.5?OBSID:STONE;S[i]=ri(250);return;}
    if(nt===ICE||nt===SNOW){T[j]=WATER;D[j]=0;M[j]=stamp;}
    else if(nt===SAND){if(R()<.01){T[j]=GLASS;}}
    else if(FLAM[nt]>0&&R()<FLAM[nt]*2)ignite(j);
  }
  if(T[i]!==LAVA)return;
  if(y>0&&T[i-W]===EMPTY){const r=R();if(r<.0006){T[i]=STONE;return;}if(r<.004)setc(i-W,r<.002?FIRE:SMOKE);}
  if(R()<.3)liquid(x,y,i,3,1);
}
function explode(cx,cy,r,quiet){
  const rr=r+2;
  for(let dy=-rr;dy<=rr;dy++){const y=cy+dy;if(y<0||y>=H)continue;
    for(let dx=-rr;dx<=rr;dx++){const x=cx+dx;if(x<0||x>=W)continue;
      const d=Math.sqrt(dx*dx+dy*dy);if(d>rr)continue;
      const i=y*W+x,t=T[i];if(t===WALL||t===VOID||t===EMPTY)continue;
      if(BOOM[t]){T[i]=EMPTY;if(booms.length<180)booms.push(x,y,BOOM[t]);continue;}
      if(d<=r){
        if((t===OBSID||t===METAL)&&d>r*.5)continue;
        if(!GASK[t]&&t!==FIRE&&R()<.14&&debris.length<1800)debris.push({x,y,vx:dx/(d+.5)*(1+R()*2)+(R()-.5),vy:dy/(d+.5)*(1+R()*2)-1.6,t:t===STONE||t===BRICK?GRAVEL:t===GRASS?EARTH:t});
        if(R()<.22){T[i]=FIRE;D[i]=4+ri(10);S[i]=0;M[i]=stamp;}else T[i]=EMPTY;
      }
      else if(FLAM[t]>0)ignite(i);
      else if(t===STONE||t===BRICK){if(R()<.45)T[i]=GRAVEL;}
      else if(t===GLASS)T[i]=SAND;
      else if(t===WATER){if(R()<.5)setc(i,STEAM);}
      else if(t===ICE||t===SNOW){T[i]=WATER;D[i]=0;}
      else if(t===SAND&&r>=9&&R()<.2)T[i]=GLASS;
    }
  }
  const r2=(r+2)*(r+2);
  for(const e of ents){const dx=e.x-cx,dy=e.y-cy;if(dx*dx+dy*dy<=r2){e.hp-=r*4;if(e.hp<=0)die(e);}}
  spark(cx,cy,Math.min(70,r*5),FIREC[4],1+r*.12);
  if(!quiet)shake=Math.max(shake,r);
}
function electrify(i0){
  const seen=new Set([i0]),st=[i0];
  while(st.length&&seen.size<900){const i=st.pop(),x=i%W,y=(i/W)|0,n=nbs(x,y,i);
    for(let k=0;k<n;k++){const j=NB[k],nt=T[j];if(nt===METAL){if(!seen.has(j)){seen.add(j);st.push(j);}}else if(FLAM[nt]>0)ignite(j);else if(nt===WATER&&R()<.3)setc(j,STEAM);}}
  charged.push({cells:[...seen],life:14});
  for(const e of ents){const i=e.y*W+e.x;if(seen.has(i+W)||seen.has(i-1)||seen.has(i+1)||seen.has(i)||seen.has(i-W))die(e);}
}

/* ================= Planter og bygninger ================= */
function canopy(x,y,r,p){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy*1.4>r*r+.5)continue;const xx=x+dx,yy=y+dy;
    if(xx<0||xx>=W||yy<1||yy>=H)continue;const i=yy*W+xx;
    if(SOFT[T[i]]&&R()<p){T[i]=PLANT;S[i]=ri(250);D[i]=0;}
  }
}
function pineRow(x,y,hw){for(let dx=-hw;dx<=hw;dx++){const xx=x+dx;if(xx<0||xx>=W||y<1)continue;const i=y*W+xx;if(SOFT[T[i]]){T[i]=PLANT;S[i]=ri(250);D[i]=1;}}}
function makeTree(x,gy,pine){
  const h=(pine?7:5)+ri(7);let y=gy-1,n=0;
  for(;n<h&&y>3;n++,y--){const i=y*W+x;if(!SOFT[T[i]]&&T[i]!==PLANT)break;T[i]=TRUNK;S[i]=ri(250);}
  if(pine){for(let k=0;k<n-1;k++)pineRow(x,y+1+k,Math.min(3,(k+1)>>1));pineRow(x,y,0);}
  else canopy(x,y+1,3+ri(2),.82);
}
function growTrees(){
  for(let k=growers.length-1;k>=0;k--){const g=growers[k];
    if(T[g.y*W+g.x]!==TRUNK){growers.splice(k,1);continue;}
    if(g.r===0){
      const ny=g.y-1,i=ny*W+g.x,t=ny>3?T[i]:WALL;
      if(g.h<g.target&&(SOFT[t]||t===PLANT)){T[i]=TRUNK;S[i]=ri(250);g.y=ny;g.h++;}
      else g.r=1;
    }else if(g.pine){pineRow(g.x,g.y-1+g.r,Math.min(3,g.r>>1));if(++g.r>g.h-1)growers.splice(k,1);}
    else{canopy(g.x,g.y,g.r,.6);if(++g.r>g.R)growers.splice(k,1);}
  }
}
// hw = halv bredde inkl. tagudhæng, ht = højde der skal være fri
function canBuild(x,y,hw,ht){
  if(x<hw+1||x>W-hw-2||y<ht+3||y>=H-5)return -1;
  let lo=H,hi=0;
  for(let dx=-hw+1;dx<=hw-1;dx++){let g=-1;
    for(let yy=y-2;yy<=y+4;yy++){const t=T[yy*W+x+dx];if(GROUND[t]){g=yy;break;}if(LIQK[t]||t===FIRE||t===PLANK||t===ROOF)return -1;}
    if(g<0)return -1;if(g<lo)lo=g;if(g>hi)hi=g;}
  if(hi-lo>3)return -1;
  const base=lo-1;
  for(let dx=-hw;dx<=hw;dx++)for(let dy=(dx===-hw||dx===hw)?2:0;dy<ht;dy++){const t=T[(base-dy)*W+x+dx];if(!SOFT[t]&&!VEG[t])return -1;}
  return base;
}
function put(xx,yy,t,d){const i=yy*W+xx;T[i]=t;D[i]=d;S[i]=ri(250);}
function footing(x,y,hw,ht){
  for(let dx=-hw-1;dx<=hw+1;dx++)for(let k=0;k<ht;k++){const i=(y-k)*W+x+dx;if(VEG[T[i]])T[i]=EMPTY;}
  for(let dx=-hw;dx<=hw;dx++)for(let yy=y+1;yy<y+6&&yy<H&&!GROUND[T[yy*W+x+dx]];yy++)put(x+dx,yy,STONE,0);}
function buildHouse(x,y,kd){
  const rc=kd.race,wall=rc===1?3:rc===2?4:rc===3?8:0;
  footing(x,y,2,7);
  for(let dx=-2;dx<=2;dx++){put(x+dx,y,PLANK,dx===0?2:wall);put(x+dx,y-1,PLANK,(dx===-1||dx===1)?1:wall);}
  const rt=rc===2?PLANT:ROOF,rd=rc===2?0:kd.col;
  for(let k=0;k<4;k++)for(let dx=-(3-k);dx<=3-k;dx++)put(x+dx,y-2-k,rt,rd);
  put(x+2,y-4,PLANK,9);put(x+2,y-5,PLANK,9);
  const h={x,y,kd:kd.id,t:ri(200),hall:false,dead:false};houses.push(h);return h;
}
function buildHall(x,y,kd){
  const rc=kd.race,wall=rc===1?3:rc===2?4:8;
  footing(x,y,3,10);
  for(let dx=-3;dx<=3;dx++){
    for(let k=0;k<5;k++)put(x+dx,y-k,PLANK,(dx===0&&k<2)?2:((dx===-2||dx===2)&&k===2)?1:wall);
    if(dx&1)put(x+dx,y-5,PLANK,wall);
  }
  for(let k=5;k<9;k++)put(x,y-k,PLANK,9);
  put(x+1,y-8,ROOF,kd.col);put(x+2,y-8,ROOF,kd.col);put(x+1,y-7,ROOF,kd.col);put(x+2,y-7,ROOF,kd.col);
  for(const bx of [x-5,x+5]){if(bx<2||bx>W-3)continue;let g=-1;for(let yy=y-2;yy<=y+3;yy++)if(GROUND[T[yy*W+bx]]){g=yy;break;}
    if(g>0&&SOFT[T[(g-1)*W+bx]]){put(bx,g-1,PLANK,10);break;}}
  const h={x,y,kd:kd.id,t:ri(200),hall:true,dead:false};houses.push(h);
  kd.hall=h;kd.cx=x;kd.cy=y;
  if(!kd.founded){kd.founded=true;log(kd.name+' er grundlagt af '+RACES[rc].pl);}
  return h;
}
const capOf=kd=>5+kd.houses*2+(kd.hall?5:0);
function updHouses(){
  const hope=age===A_HOPE,st=hope?2:1;
  for(let k=houses.length-1;k>=0;k--){const h=houses[k];h.t+=st;
    const kd=kds.get(h.kd);
    if(!kd){h.dead=true;houses.splice(k,1);continue;}
    if(h.t%120<st){let c=0;const hw=h.hall?3:2;for(let dx=-hw;dx<=hw;dx++){if(T[h.y*W+h.x+dx]===PLANK)c++;if(T[(h.y-1)*W+h.x+dx]===PLANK)c++;}
      if(c<(h.hall?8:6)){h.dead=true;houses.splice(k,1);if(h.hall){kd.hall=null;log('Rådhuset i '+kd.name+' er faldet');}continue;}}
    if(h.t%600<st){kd.food=Math.min(60,kd.food+1);if(kd.food<4){if(kd.gold>0){kd.gold--;kd.food+=6;}else if(kd.wood>40){kd.wood-=10;kd.food+=3;}}}
    if(h.t%300>=150&&h.t%300<150+st&&kd.pop>0&&kd.pop<capOf(kd)&&kd.food>=2&&ents.length<MAXE){kd.food-=2;const e=spawnUnit(kd,h.x,h.y);if(e&&!h.hall)e.home=h;}
    if(!h.hall&&R()<.02){const i=(h.y-6)*W+h.x+2;if(T[i]===EMPTY&&T[i+W]===PLANK)setc(i,SMOKE);}
  }
}

const wkey=(a,b)=>a<b?a+'-'+b:b+'-'+a;
function newKd(race,x){
  const id=kdSeq++;let name,n=0;do{name=pick(KN[race][0])+pick(KN[race][1]);}while(n++<30&&[...kds.values()].some(k=>k.name===name));

function kdNear(x,race){let best=-1,bd=45;for(const e of ents){if(e.k!==UNIT||e.dead||e.race!==race)continue;const d=Math.abs(e.x-x);if(d<bd){bd=d;best=e.kd;}}return kds.get(best)||null;}
function spawn(k,x,y){
  if(ents.length>=MAXE||x<1||x>W-2||y<5||y>H-1)return null;
  const K=KIND[k],e={k,x,y,dir:R()<.5?-1:1,age:0,id:entSeq++,hp:K.hp,maxhp:K.hp,pow:K.pow||0,life:K.life[0]+ri(K.life[1]),air:AIR,bury:40,cd:ri(60),food:0,kills:0,dead:false,kd:-1,race:-1,name:K.n,plague:0,immune:false,bless:0,king:false,traits:[],sp:K.sp||3,climb:K.climb||2,tx:-1,ty:0,stuck:0,bm:false,gard:false,pyro:false,role:0,goal:0,gt:0,tgt:null,tgx:0,home:null,inside:false};
  ents.push(e);return e;
}
function spawnUnit(kd,x,y){
  const e=spawn(UNIT,x,y);if(!e)return null;const rc=RACES[kd.race];
  e.kd=kd.id;e.race=kd.race;e.name=uname(kd.race);e.hp=e.maxhp=rc.hp;e.pow=rc.pow;e.life=rc.life[0]+ri(rc.life[1]);e.sp=rc.sp;

  else if(R()<.35){wars.delete(key);log(a.name+' og '+b.name+' har sluttet fred');}
}

/* ================= Kræfter og katastrofer ================= */
function bolt(cx,y0){
  let x=clamp(cx,1,W-2),y=y0||0;const pts=[];
  while(y<H-1){const i=y*W+x;if(DENS[T[i]]>0)break;pts.push(i);y++;const r=R();x+=r<.3?-1:r<.6?1:0;x=clamp(x,1,W-2);}
  bolts.push({pts,life:9});flash=Math.max(flash,.25);
  const i=y*W+x,t=T[i];
  if(t===METAL){electrify(i);return;}
  if(t===SAND)for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<W&&yy>=0&&yy<H&&T[yy*W+xx]===SAND&&dx*dx+dy*dy<=5)T[yy*W+xx]=GLASS;}
  explode(x,y,3,false);
}
function meteor(cx,cy){const d=R()<.5?-1:1;meteors.push({x:cx-d*cy*.5,y:0,vx:d*.5});}
function updMeteors(){
  for(let k=meteors.length-1;k>=0;k--){const m=meteors[k];let h=false;
    for(let s=0;s<3&&!h;s++){m.x+=m.vx;m.y++;const x=Math.round(m.x),y=m.y;
      if(y>=H-1){h=true;break;}
      if(x<0||x>=W)continue;const i=y*W+x;
      if(DENS[T[i]]>0)h=true;else{T[i]=FIRE;D[i]=5+ri(6);S[i]=0;}
    }
    if(h){const x=clamp(Math.round(m.x),0,W-1),y=Math.min(H-1,m.y);
      explode(x,y,9,false);
      for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){if(dx*dx+dy*dy>9)continue;const xx=x+dx,yy=y+4+dy;if(xx<0||xx>=W||yy<0||yy>=H)continue;const i=yy*W+xx;if(T[i]!==WALL)setc(i,LAVA);}
      log('En meteor slog ned');meteors.splice(k,1);
    }else if(m.y>H)meteors.splice(k,1);
  }
}
function nuke(x,y){
  explode(x,y,24,false);flash=1;shake=30;
  for(let k=0;k<420;k++){const a=R()*6.283,d=R()*22,xx=Math.round(x+Math.cos(a)*d),yy=Math.round(y-8+Math.sin(a)*d*.8);if(xx>=0&&xx<W&&yy>=0&&yy<H&&T[yy*W+xx]===EMPTY)setc(yy*W+xx,R()<.2?ASH:SMOKE);}
  log('En atombombe er sprængt');
}
function updTornados(){
  for(let k=tornados.length-1;k>=0;k--){const t=tornados[k];
    t.x+=t.dir*.25;if(R()<.008)t.dir=-t.dir;if(t.x<6){t.x=6;t.dir=1;}if(t.x>W-7){t.x=W-7;t.dir=-1;}
    const x=t.x|0;let gy=4;for(;gy<H-1;gy++)if(DENS[T[gy*W+x]]>=5)break;t.gy=gy;
    for(let n=0;n<7;n++){const xx=x+ri(9)-4,yy=gy+ri(6)-2;if(xx<0||xx>=W||yy<0||yy>=H)continue;const i=yy*W+xx,tt=T[i];
      if(tt===EMPTY||tt===WALL||tt===OBSID||tt===METAL||tt===VOID||(tt===STONE&&R()<.9))continue;
      T[i]=EMPTY;if(!GASK[tt]&&debris.length<1800)debris.push({x:xx,y:yy,vx:(R()-.5)*3,vy:-(1.5+R()*2.6),t:tt===GRASS?EARTH:tt});}
    for(const e of ents){if(e.k===DRAGON||e.inside)continue;if(Math.abs(e.x-x)<5&&e.y>gy-22&&e.y<gy+3&&R()<.3){e.y=Math.max(7,e.y-ri(4));e.x=clamp(e.x+ri(5)-2,2,W-3);e.hp-=.3;if(e.hp<=0)die(e);}}
    if(--t.life<=0)tornados.splice(k,1);
  }
}
function quake(x){
  quakes.push({x,life:110});log('Jorden skælver');
  let cx=clamp(x,2,W-3);for(let y=surf(cx),n=0;n<38&&y<H-1;n++,y++){for(let d=0;d<2;d++){const i=y*W+cx+d;if(T[i]!==WALL)T[i]=EMPTY;}if(R()<.4)cx=clamp(cx+ri(3)-1,2,W-3);}
}
function updQuakes(){
  for(let k=quakes.length-1;k>=0;k--){const q=quakes[k];shake=Math.max(shake,5);
    for(let n=0;n<60;n++){const xx=q.x+ri(91)-45,yy=ri(H);if(xx<0||xx>=W)continue;const i=yy*W+xx,t=T[i];
      if(t===STONE||t===BRICK){if(R()<.5)T[i]=GRAVEL;}else if(t===GLASS)T[i]=SAND;
      else if((t===PLANK||t===ROOF||t===WOOD)&&R()<.6){T[i]=EMPTY;if(debris.length<1800)debris.push({x:xx,y:yy,vx:(R()-.5),vy:-R(),t:WOOD});}}
    if(--q.life<=0)quakes.splice(k,1);
  }
}
function volcano(x){
  x=clamp(x,16,W-17);const g0=surf(x);let top=g0;
  for(let dx=-13;dx<=13;dx++){const xx=x+dx,g=surf(xx),h=14-Math.abs(dx),ty=Math.min(g,g0)-h;
    for(let yy=g-1;yy>=ty&&yy>4;yy--){const i=yy*W+xx;if(T[i]!==WALL)setc(i,dx===0?LAVA:STONE);}
    if(dx===0){top=ty;for(let yy=g;yy<g+8&&yy<H-1;yy++)if(T[yy*W+xx]!==WALL)setc(yy*W+xx,LAVA);}}
  volcanos.push({x,y:Math.max(5,top),life:720});log('En vulkan er brudt frem');
}
function updVolcanos(){
  for(let k=volcanos.length-1;k>=0;k--){const v=volcanos[k];
    if(v.life>640)shake=Math.max(shake,3);

    if(R()<.3){const i=(v.y-2)*W+v.x+ri(3)-1;if(i>=0&&T[i]===EMPTY)setc(i,SMOKE);}

  }
}
function updDebris(){
  for(let k=debris.length-1;k>=0;k--){const d=debris[k];d.vy+=.12;const nx=d.x+d.vx,ny=d.y+d.vy,cx=Math.round(nx),cy=Math.round(ny);
    if(cx<0||cx>=W){debris[k]=debris[debris.length-1];debris.pop();continue;}
    if(cy>=H||(cy>=0&&!SOFT[T[cy*W+cx]])){
      const px=clamp(Math.round(d.x),0,W-1),py=Math.round(d.y);
      if(py>=0&&py<H&&SOFT[T[py*W+px]]){setc(py*W+px,d.t);if(d.t===FIRE)D[py*W+px]=14+ri(10);}
      else if(d.t===FIRE&&cy<H&&cy>=0&&FLAM[T[cy*W+cx]]>0)ignite(cy*W+cx);
      debris[k]=debris[debris.length-1];debris.pop();continue;}
    d.x=nx;d.y=ny;
  }
}
function updParts(){
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.vy+=.05;p.x+=p.vx;p.y+=p.vy;p.vx*=.97;if(--p.life<=0){parts[k]=parts[parts.length-1];parts.pop();}}
  for(let k=rockets.length-1;k>=0;k--){const r=rockets[k];r.y-=1.5;const y=Math.round(r.y);
    if(parts.length<1600)parts.push({x:r.x,y:r.y+1,vx:(R()-.5)*.3,vy:.3,life:8,c:FIREC[4]});
    if(--r.life<=0||y<4||!SOFT[T[y*W+r.x]]){spark(r.x,r.y,46,FWC[r.h],1.1);if(R()<.5)spark(r.x,r.y,20,FWC[ri(FWC.length)],.6);rockets.splice(k,1);}}
}
// Varme, kulde og vind som pensler
function heatAt(cx,cy,r,cold){
  for(let dy=-r;dy<=r;dy++){const y=cy+dy;if(y<0||y>=H)continue;
    for(let dx=-r;dx<=r;dx++){const x=cx+dx;if(x<0||x>=W||dx*dx+dy*dy>r*r+r*.6||R()>.25)continue;const i=y*W+x,t=T[i];if(t===EMPTY||t===WALL)continue;
      if(cold){if(t===WATER){T[i]=ICE;D[i]=0;}else if(t===STEAM){T[i]=WATER;D[i]=0;}else if(t===LAVA)T[i]=R()<.3?OBSID:STONE;else if(t===FIRE)T[i]=EMPTY;else if(t===CLOUD){T[i]=SNOW;D[i]=0;}else if(t===MUD)T[i]=EARTH;}
      else{if(t===ICE||t===SNOW){T[i]=WATER;D[i]=0;}else if(t===WATER){if(R()<.3)setc(i,STEAM);}else if(FLAM[t]>0)ignite(i);else if(BOOM[t])ignite(i);else if(t===SAND){if(R()<.04)T[i]=GLASS;}else if(MELT[t]){if(R()<.02)setc(i,LAVA);}else if(t===MUD)T[i]=EARTH;else if(t===CLOUD)T[i]=EMPTY;}
    }}
  if(!cold)for(const e of ents){const dx=e.x-cx,dy=e.y-cy;if(dx*dx+dy*dy<=r*r&&e.k!==DEMON){e.hp-=.4;if(e.hp<=0)die(e);}}
}
function windAt(cx,cy,r,vx,vy){
  for(let dy=-r;dy<=r;dy++){const y=cy+dy;if(y<0||y>=H)continue;
    for(let dx=-r;dx<=r;dx++){const x=cx+dx;if(x<0||x>=W||dx*dx+dy*dy>r*r+r*.6||R()>.3)continue;const i=y*W+x,t=T[i];
      if(t===EMPTY||DENS[t]>=9)continue;
      if(GASK[t]||t===FIRE){const j=i+(vx>0?1:-1);if(T[j]===EMPTY)swap(i,j);continue;}
      if(debris.length<1800){T[i]=EMPTY;debris.push({x,y,vx:vx*(1.2+R())+(R()-.5)*.6,vy:vy*(1.2+R())-.8-R()*.8,t});}
    }}
  for(const e of ents){const dx=e.x-cx,dy=e.y-cy;if(dx*dx+dy*dy<=r*r&&!e.inside&&R()<.5){const nx=clamp(e.x+(vx>0?1:-1),2,W-3);if(PASS[T[e.y*W+nx]]&&PASS[T[(e.y-1)*W+nx]])e.x=nx;}}
}

/* ================= Økologi og tidsaldre ================= */
function eco(){
  const K=(N/150)|0,ice=age===A_ICE,hope=age===A_HOPE;
  for(let n=0;n<K;n++){
    const i=ri(N),t=T[i];if(t===EMPTY||t===STONE)continue;
    const y=(i/W)|0,up=y>0?T[i-W]:WALL;
    switch(t){
      case EARTH:if(up===EMPTY){if(R()<.3){let ok=true;for(let k=2;k<7&&y-k>=0;k++)if(OPAQ[T[i-k*W]]){ok=false;break;}if(ok)T[i]=GRASS;}}else if(up===WATER&&D[i-W]===0&&R()<.03)T[i]=MUD;break;
      case GRASS:if(up===EMPTY&&y>8){const r=R();if(r<(hope?.03:.006)){T[i-W]=FLOWER;S[i-W]=ri(250);D[i-W]=0;}else if(r>.9992)setc(i-W,SEED);}
        else if(up!==EMPTY&&!PASS[up]&&up!==FIRE&&R()<.5)T[i]=EARTH;break;
      case FLOWER:if(R()<.04||(T[i+W]!==GRASS&&T[i+W]!==EARTH))T[i]=EMPTY;break;
      case WHEAT:if(y<H-1&&T[i+W]!==GRASS&&T[i+W]!==EARTH)T[i]=EMPTY;else if(D[i]<3&&R()<.35)D[i]++;break;
      case WATER:if(up===EMPTY){if(ice){if(R()<.3){T[i]=ICE;D[i]=1;}}else if(night<.5&&R()<.004){T[i]=STEAM;D[i]=250;}}
        else if(up===WATER&&y<H-1&&R()<.004){const b=T[i+W];if(b===SAND||b===MUD||b===EARTH)T[i]=KELP;}break;
      case KELP:if(up===WATER){let h=1;while(h<9&&T[i+h*W]===KELP)h++;if(h<7&&R()<.1&&y>1&&T[i-2*W]===WATER){T[i-W]=KELP;S[i-W]=ri(250);}}
        else if(up!==KELP&&T[i-1]!==WATER&&T[i+1]!==WATER)T[i]=EMPTY;break;
      case ICE:if(!ice&&D[i]===1&&(up===EMPTY||up===WATER)&&R()<.1){T[i]=WATER;D[i]=0;}break;
      case SNOW:if(!ice&&D[i]===1&&R()<.08){T[i]=WATER;D[i]=1;}break;
      case MUD:if(up===EMPTY&&R()<.06)T[i]=EARTH;break;
      case PLANT:if(ice&&up===EMPTY&&R()<.002){setc(i-W,SNOW);D[i-W]=1;}break;
    }
  }
}
function setAge(a){age=a;ageT=0;log(AGES[a].n+' er begyndt');makeSky();}
function ageFx(){
  if(laws.ages&&++ageT>AGELEN){let a;do{a=ri(AGES.length);}while(a===age);setAge(a);}
  if(tick%1800===0)wind=R()<.5?-1:1;
  const r=R(),ws=W/340;
  if(age===A_ICE){if(r<.12*ws){const i=ri(W);if(T[i]===EMPTY){setc(i,SNOW);D[i]=1;}}}
  else if(age===A_ASH){if(r<.08*ws){const i=ri(W);if(T[i]===EMPTY)setc(i,ASH);}else if(r>1-.0005*ws)meteor(ri(W),H>>1);}
  else if(age===A_RAIN){if(r<.1*ws){const i=(2+ri(cloudBand-2))*W+ri(W);if(T[i]===EMPTY)setc(i,CLOUD);}}
  else if(age===A_DARK){if(r<.002*ws){const u=ents.filter(e=>e.k===UNIT&&!e.inside);if(u.length){const o=pick(u),x=clamp(o.x+ri(41)-20,2,W-3),y=surf(x)-1;if(PASS[T[y*W+x]]&&PASS[T[(y-1)*W+x]])spawn(ZOMBIE,x,y);}}}
  if(age!==A_RAIN&&age!==A_DARK&&r>1-.006*ws){const x=wind>0?0:W-1,y=3+ri(cloudBand-4),cw=5+ri(7);
    for(let dy=-2;dy<=2;dy++)for(let dx=0;dx<cw*2;dx++){const q=(dx-cw)/cw;if(q*q+dy*dy/5>1||R()<.12)continue;const i=(y+dy)*W+clamp(x+dx*wind,0,W-1);if(T[i]===EMPTY){setc(i,CLOUD);D[i]=30;}}}
  if(laws.doom&&R()<.00025*ws){const x=10+ri(W-20),k=ri(4);if(k===0){bolt(x,0);log('Lynet slog ned');}else if(k===1)meteor(x,H>>1);else if(k===2)quake(x);else{tornados.push({x,life:700,dir:R()<.5?-1:1,gy:surf(x)});log('En tornado har rejst sig');}}
}

/* ================= Simulation ================= */
function simStep(){
  tick++;stamp=tick&255;clock++;
  for(let n=0;n<14&&booms.length;n++){const r=booms.pop(),y=booms.pop(),x=booms.pop();explode(x,y,r,r<5);}
  const ltr=tick&1;
  for(let y=H-1;y>=0;y--){const row=y*W;
    for(let k=0;k<W;k++){
      const x=ltr?k:W-1-k,i=row+x,t=T[i];
      if(!ACTIVE[t]||M[i]===stamp)continue;
      switch(t){
        case SAND:case ASH:case GUNP:case BONE:case FIREWORK:case THERM:powder(x,y,i);break;
        case SNOW:if(R()<.5)powder(x,y,i);break;
        case SALT:{const j=nb(x,y,i);if(j>=0){const nt=T[j];if(nt===WATER){if(R()<.04){T[i]=EMPTY;break;}}else if((nt===ICE||nt===SNOW)&&R()<.1){T[j]=WATER;D[j]=0;M[j]=stamp;}else if(nt===MOLD)T[j]=EMPTY;}powder(x,y,i);break;}
        case SEED:if(!powder(x,y,i)&&y<H-1){const b=T[i+W];if((b===EARTH||b===GRASS)&&R()<.01){T[i]=TRUNK;growers.push({x,y,h:1,target:5+ri(9),r:0,R:3+ri(3),pine:y<H*.47});}}break;
        case EARTH:case GRASS:case MUD:case GRAVEL:heavy(x,y,i);break;
        case WATER:{
          if(D[i]===1&&y<H-1){const b=T[i+W];if(b===WATER){if(D[i+W]===0)D[i]=0;}else if(DENS[b]>=5&&y>0&&T[i-W]!==WATER&&R()<.012){T[i]=EMPTY;D[i]=0;break;}}
          const j=nb(x,y,i);if(j>=0){const nt=T[j];
            if(nt===PLANT){if(R()<.004){T[i]=PLANT;D[i]=D[j];M[i]=stamp;break;}}
            else if(nt===SPONGE){if(D[j]<40){D[j]++;T[i]=EMPTY;break;}}
            else if(nt===CRYSTAL&&R()<.002){T[i]=CRYSTAL;D[i]=0;M[i]=stamp;break;}}
          liquid(x,y,i,2,5);break;}
        case OIL:liquid(x,y,i,1,3);break;
        case NITRO:liquid(x,y,i,2,4);break;
        case MERC:liquid(x,y,i,6,3);break;
        case NAPALM:if(R()<.5)liquid(x,y,i,1,1);break;
        case ACID:{const j=nb(x,y,i);if(j>=0){const nt=T[j];
            if(nt===WATER){if(R()<.03){T[i]=WATER;D[i]=0;break;}}
            else if(!NOACID[nt]&&R()<.1){T[j]=EMPTY;if(R()<.5){if(R()<.3)setc(i,SMOKE);else T[i]=EMPTY;break;}}}
          liquid(x,y,i,2,4);break;}
        case LAVA:lava(x,y,i);break;
        case FIRE:fire(x,y,i);break;
        case SMOKE:case STEAM:case GAS:gas(x,y,i,t);break;
        case CLOUD:cloud(x,y,i);break;
        case TORCH:if(y>0&&T[i-W]===EMPTY&&R()<.5){const u=i-W;T[u]=FIRE;D[u]=4+ri(5);S[u]=0;M[u]=stamp;}break;
        case SPOUT:{const j=nb(x,y,i);if(j>=0&&T[j]===EMPTY&&R()<.3)setc(j,WATER);break;}
        case CLONE:{const j=nb(x,y,i);if(j<0)break;const nt=T[j];
          if(D[i]===0){if(nt!==EMPTY&&nt!==CLONE&&nt!==WALL&&nt!==FIRE)D[i]=nt;}
          else if(nt===EMPTY&&R()<.25)setc(j,D[i]);break;}
        case VOID:{const n=nbs(x,y,i);for(let q=0;q<n;q++){const j=NB[q],nt=T[j];if(nt!==EMPTY&&DENS[nt]<9)T[j]=EMPTY;}break;}
        case MOLD:{const r=R();if(r<.0012){T[i]=EMPTY;break;}if(r<.03){const j=nb(x,y,i);if(j>=0&&MOLDY[T[j]]){T[j]=MOLD;S[j]=ri(250);D[j]=0;M[j]=stamp;}}break;}
        case URAN:if(R()<.02){const xx=x+ri(13)-6,yy=y+ri(13)-6;
            if(xx>=0&&xx<W&&yy>=0&&yy<H){const j=yy*W+xx,nt=T[j];if(nt===GRASS)T[j]=EARTH;else if(nt===PLANT||nt===FLOWER||nt===WHEAT||nt===KELP)T[j]=EMPTY;}
            if(R()<.15)for(const e of ents){if(e.dead||Math.abs(e.x-x)>7||Math.abs(e.y-y)>7)continue;if(e.k===UNIT){if(R()<.25)zombify(e);}else if(e.k!==ZOMBIE&&e.k!==DEMON&&e.k!==DRAGON&&R()<.15)die(e);}}break;
      }
    }
  }
  eco();ageFx();
  if(tick%3===0)growTrees();
  updDebris();updParts();updMeteors();updTornados();updQuakes();updVolcanos();
  for(let k=0;k<ents.length;k++){const e=ents[k];if(!e.dead)updEnt(e);}
  if(tick%4===0)fights();
  let w=0;for(let k=0;k<ents.length;k++)if(!ents[k].dead)ents[w++]=ents[k];ents.length=w;
  updHouses();
  if(tick%20===0)census();
  if(tick%900===0)diplomacy();
  const day=clamp(.5+.8*Math.cos(clock/DAYLEN*Math.PI*2),0,1);
  night=age===A_DARK?Math.max(.75,1-day):1-day;
  if(tick%10===0)makeSky();
}
function makeSky(){
  const d=1-night,a=AGES[age],m1=[70,92,128],m2=[52,74,98];
  for(let y=0;y<H;y++){const f=y/H;
    const r=(14+20*f)*(1-d)+(a.top[0]+(a.bot[0]-a.top[0])*f)*d,g=(18+26*f)*(1-d)+(a.top[1]+(a.bot[1]-a.top[1])*f)*d,b=(44+40*f)*(1-d)+(a.top[2]+(a.bot[2]-a.top[2])*f)*d;
    sky[y]=rgb(r|0,g|0,b|0);
    const k=.25+.75*d;
    skyM1[y]=rgb((r*.55+m1[0]*.45*k)|0,(g*.55+m1[1]*.45*k)|0,(b*.55+m1[2]*.45*k)|0);
    skyM2[y]=rgb((r*.3+m2[0]*.7*k)|0,(g*.3+m2[1]*.7*k)|0,(b*.3+m2[2]*.7*k)|0);}
}

/* ================= Verdensbygger ================= */
function clearWorld(){T.fill(0);D.fill(0);S.fill(0);M.fill(0);ents=[];houses=[];growers=[];bolts=[];meteors=[];debris=[];parts=[];rockets=[];booms=[];tornados=[];quakes=[];volcanos=[];charged=[];

  if(pts.has(ev.pointerId))pts.set(ev.pointerId,evPx(ev));
  if(pinch&&pts.size>=2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1,mx=(a[0][0]+a[1][0])/2,my=(a[0][1]+a[1][1])/2;
    cam.x-=(mx-pinch.mx)/cam.z;cam.y-=(my-pinch.my)/cam.z;zoomAt(d/pinch.d,mx,my);pinch={d,mx,my};return;}
  const opx=ptr.px,opy=ptr.py;cell(ev);ptr.inside=true;
  if(ptr.pan){cam.x-=(ptr.px-opx)/cam.z;cam.y-=(ptr.py-opy)/cam.z;clampCam();cell(ev);return;}
  if(ptr.down){const dx=ptr.x-ptr.lx,dy=ptr.y-ptr.ly;if(dx||dy){const l=Math.hypot(dx,dy);ptr.vx=dx/l;ptr.vy=dy/l;}
    if(ptr.erase)line(ptr.lx,ptr.ly,ptr.x,ptr.y,-1);else if(tool.m!==undefined)line(ptr.lx,ptr.ly,ptr.x,ptr.y,tool.m,tool.spray);}
  ptr.lx=ptr.x;ptr.ly=ptr.y;});
const up=ev=>{pts.delete(ev.pointerId);if(pts.size<2)pinch=null;ptr.down=false;ptr.pan=false;ptr.erase=false;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{ptr.inside=false;});
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
cv.addEventListener('wheel',ev=>{ev.preventDefault();const p=evPx(ev);zoomAt(Math.exp(-ev.deltaY*.0016),p[0],p[1]);},{passive:false});
function miniGo(ev){const r=mini.getBoundingClientRect();lookAt((ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H);}
let miniDown=false;
mini.addEventListener('pointerdown',ev=>{ev.preventDefault();miniDown=true;try{mini.setPointerCapture(ev.pointerId);}catch(_){}miniGo(ev);});
mini.addEventListener('pointermove',ev=>{if(miniDown)miniGo(ev);});
mini.addEventListener('pointerup',()=>{miniDown=false;});mini.addEventListener('pointercancel',()=>{miniDown=false;});

/* ================= Brugerflade ================= */
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;};
const logEl=$('log');
function log(msg){if(!logEl)return;const d=el('div','',msg);logEl.appendChild(d);while(logEl.children.length>5)logEl.removeChild(logEl.firstChild);setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},7000);}
function showInsp(){
  const e=inspected,box=$('insp');if(!e){box.hidden=true;return;}box.hidden=false;
  const kd=kds.get(e.kd);
  $('iName').textContent=e.name+(e.king?' (hersker)':'');
  $('iSub').textContent=e.k===UNIT?RACES[e.race].n+(kd?' fra '+kd.name:'')+' · '+ROLEN[e.role]:KIND[e.k].n;
  $('iHp').style.width=(e.dead?0:clamp(e.hp/e.maxhp,0,1)*100)+'%';
  const doing=e.inside?'Sover derhjemme':e.goal===1?'Flygter':e.goal===2?(e.tgt&&(e.tgt.k===SHEEP||e.tgt.k===RABBIT)?'Jager':'Kæmper'):e.goal===3?'På vej hjem':e.goal===4?'På krigstogt':'';
  $('iStat').textContent=e.dead?'Død':'Alder '+((e.age/YEAR)|0)+' år · Liv '+Math.max(0,Math.ceil(e.hp))+'/'+Math.ceil(e.maxhp)+' · Drab '+e.kills+(doing?' · '+doing:'');
  const st=[];if(e.traits.length)st.push(e.traits.join(', '));if(e.plague)st.push('pestsyg');if(e.immune)st.push('immun');if(e.bless>0)st.push('velsignet');
  $('iTrait').textContent=st.length?st.join(' · '):'Ingen særlige træk';
}
let lastK='';
function ui(){
  $('sYear').textContent=(clock/YEAR)|0;$('sAge').textContent=AGES[age].n;$('sPop').textContent=cnt[UNIT];$('sHouse').textContent=houses.length;$('sAnim').textContent=cnt[SHEEP]+cnt[RABBIT]+cnt[WOLF]+cnt[BIRD]+cnt[FISH];
  if(inspected)showInsp();
  const key=[...kds.values()].map(k=>k.id+':'+k.pop+':'+k.houses+':'+k.food+':'+(k.wood|0)+':'+k.gold+':'+k.enemy).join('|');
  if(key===lastK)return;lastK=key;
  const box=$('kds');box.textContent='';
  if(!kds.size){box.textContent='Ingen riger endnu. Vælg et folkeslag under Væsner, og sæt nogle ud på græsset.';return;}
  for(const k of kds.values()){const c=el('button','kd');c.type='button';c.title='Gå til '+k.name;
    const d=el('i','dot');d.style.background=KHEX[k.col];
    c.append(d,el('b','',k.name),el('span','',k.pop+' '+RACES[k.race].pl+' · '+k.houses+' huse · '+k.food+' mad · '+(k.wood|0)+' træ'+(k.gold?' · '+k.gold+' guld':'')));
    const en=kds.get(k.enemy);if(en)c.appendChild(el('em','','i krig med '+en.name));
    c.addEventListener('click',()=>lookAt(k.cx,k.cy-10));
    box.appendChild(c);}
}
function selectTool(t){tool=t;document.querySelectorAll('.tool').forEach(o=>o.setAttribute('aria-pressed',o._t===t?'true':'false'));
  const tip=$('tip');tip.textContent='';tip.append(el('b','',t.n+'. '),document.createTextNode(t.d||''));
  cv.style.cursor=t.p==='hand'?'grab':'crosshair';}
function toolBtn(t,k){const b=el('button','tool');b.type='button';b.id='tool'+k;b.title=t.n+'. '+(t.d||'');b._t=t;b.setAttribute('aria-pressed','false');
  b.append(iconFor(t),el('span','',t.n));b.addEventListener('click',()=>selectTool(t));return b;}
function worldPanel(panel){
  const g1=el('div','wgrp');g1.append(el('h2','','Verdens størrelse'));const r1=el('div');
  SIZES.forEach((s,k)=>{const b=el('button','btn',s[0]);b.type='button';b.id='size'+k;b.setAttribute('aria-pressed',k===sizeIx?'true':'false');b.title=s[1]+' × '+s[2]+' felter';
    b.addEventListener('click',()=>{sizeIx=k;r1.querySelectorAll('button').forEach((o,n)=>o.setAttribute('aria-pressed',n===k?'true':'false'));});r1.appendChild(b);});
  g1.appendChild(r1);
  const g2=el('div','wgrp');g2.append(el('h2','','Skab'));const r2=el('div');
  const bn=el('button','btn','Ny verden');bn.type='button';bn.id='bNew';bn.addEventListener('click',()=>{newWorld(true);log('En ny verden er skabt');});
  const bc=el('button','btn','Tom verden');bc.type='button';bc.id='bClear';bc.addEventListener('click',()=>newWorld(false));
  const ba=el('button','btn','Skift tidsalder');ba.type='button';ba.id='bAge';ba.addEventListener('click',()=>setAge((age+1)%AGES.length));
  r2.append(bn,bc,ba);g2.appendChild(r2);
  const g3=el('div','wgrp');g3.append(el('h2','','Verdens love'));const r3=el('div');
  [['war','Krig og diplomati'],['ages','Tidsaldre skifter'],['doom','Naturkatastrofer']].forEach(l=>{const b=el('button','btn',l[1]);b.type='button';b.id='law_'+l[0];b.setAttribute('aria-pressed',laws[l[0]]?'true':'false');
    b.addEventListener('click',()=>{laws[l[0]]=!laws[l[0]];b.setAttribute('aria-pressed',laws[l[0]]?'true':'false');if(l[0]==='war'&&!laws.war){wars.clear();census();}});r3.appendChild(b);});
  g3.appendChild(r3);
  panel.append(g1,g2,g3);
}
let curTab='earth';
function showTab(id){curTab=id;const panel=$('panel');panel.textContent='';
  document.querySelectorAll('.tab').forEach(o=>o.setAttribute('aria-selected',o._id===id?'true':'false'));
  if(id==='world'){worldPanel(panel);return;}
  TOOLS.forEach((t,k)=>{if(t.tab!==id)return;if(t.sub)panel.appendChild(el('div','sep',t.sub));const b=toolBtn(t,k);if(t===tool)b.setAttribute('aria-pressed','true');panel.appendChild(b);});
}
function buildDock(){
  const tabs=$('tabs');
  TABS.forEach(tb=>{const b=el('button','tab');b.type='button';b._id=tb[0];b.id='tab_'+tb[0];b.setAttribute('role','tab');
    const first=tb[0]==='world'?{p:'world'}:TOOLS.find(t=>t.tab===tb[0]);b.append(iconFor(first),el('span','',tb[1]));
    b.addEventListener('click',()=>showTab(tb[0]));tabs.appendChild(b);});
  const fx=$('fixtools');FIXT.forEach((t,k)=>fx.appendChild(toolBtn(t,'f'+k)));
  showTab('earth');selectTool(TOOLS[0]);
}
function setBrush(v){brush=clamp(v,0,12);$('brush').value=brush;$('brushOut').textContent=brush;}
$('brush').addEventListener('input',e=>setBrush(+e.target.value));
$('bPause').addEventListener('click',()=>{paused=!paused;$('bPause').textContent=paused?'Fortsæt':'Pause';});
$('bSpeed').addEventListener('click',()=>{speed=speed===1?2:speed===2?4:1;$('bSpeed').textContent='Fart '+speed+'×';});
$('inspX').addEventListener('click',()=>{inspected=null;showInsp();});
$('zIn').addEventListener('click',()=>zoomAt(1.35,cv.width/2,cv.height/2));
$('zOut').addEventListener('click',()=>zoomAt(1/1.35,cv.width/2,cv.height/2));
$('zFit').addEventListener('click',()=>{cam.z=zmin;clampCam();});
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const st=24/cam.z*8;
  if(e.code==='Space'){e.preventDefault();$('bPause').click();}else if(e.key==='[')setBrush(brush-1);else if(e.key===']')setBrush(brush+1);
  else if(e.key==='ArrowLeft'||e.key==='a'){cam.x-=st;clampCam();}else if(e.key==='ArrowRight'||e.key==='d'){cam.x+=st;clampCam();}
  else if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();cam.y-=st;clampCam();}else if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();cam.y+=st;clampCam();}
  else if(e.key==='+'||e.key==='=')zoomAt(1.25,cv.width/2,cv.height/2);else if(e.key==='-')zoomAt(.8,cv.width/2,cv.height/2);});
window.addEventListener('resize',resize);
const hovEl=$('hov');
function hover(){
  if(!ptr.inside||ptr.x<0||ptr.x>=W||ptr.y<0||ptr.y>=H){hovEl.textContent='';return;}
  const e=nearestEnt(ptr.x,ptr.y,2.6);let s;
  if(e){const kd=kds.get(e.kd);s=e.k===UNIT?e.name+' · '+RACES[e.race].n.toLowerCase()+(kd?' fra '+kd.name:''):KIND[e.k].n;}
  else{const i=ptr.y*W+ptr.x,t=T[i];s=t===EMPTY?'':t===PLANK?(D[i]===10?'Bål':D[i]===9?'Skorsten':'Hus'):t===WATER&&D[i]===1?'Regnvand':NAME[t];}
  if(hovEl.textContent!==s)hovEl.textContent=s;
}

/* ================= Start ================= */
function newWorld(gen){
  const s=SIZES[sizeIx];if(s[1]!==W||s[2]!==H||!T){alloc(s[1],s[2]);buffers();}
  sprCache.clear();lastK='';resize();
  let kd=null;if(gen)kd=genWorld();else{clearWorld();census();}
  cam.z=Math.max(zmin,cv.height/Math.min(H,150));clampCam();
  if(kd)lookAt(kd.cx,kd.cy-12);else lookAt(W/2,H*.5);
  frameNo=0;
}
let last=0,acc=0;
function frame(ts){
  const dt=Math.min(100,ts-last||16);last=ts;
  if(ptr.down)act();
  if(!paused){acc+=dt*.06*speed;let n=Math.min(8,acc|0);acc-=acc|0;while(n-->0)simStep();}
  render();
  if(frameNo%6===0)hover();
  requestAnimationFrame(frame);
}
function boot(){buildDock();resize();newWorld(true);requestAnimationFrame(frame);}
window.__sv={step:simStep,render,get ents(){return ents;},get houses(){return houses;},kds,wars,laws,cam,explode,bolt,meteor,nuke,quake,volcano,tornados,setAge,spawn,spawnUnit,newKd,surf,setc,heatAt,windAt,
  get W(){return W;},get H(){return H;},count(t){let c=0;for(let i=0;i<N;i++)if(T[i]===t)c++;return c;},set(x,y,t){setc(y*W+x,t);},
  size(k){sizeIx=k;newWorld(true);},zoomAt,lookAt};
boot();
})();
