<style>
/* Layout: one phone-height screen. A Danish wall calendar on a parliament-blue desk; each card is a tear-off sheet. Single committed look. */
:root{
  --desk:#1c3247;       /* Christiansborg-blå bordplade */
  --desk-2:#26425c;
  --paper:#fbfaf7;      /* kalenderpapir */
  --ink:#1a1e24;
  --muted:#5d6672;
  --holiday:#cf2a31;    /* helligdagsrød fra kalenderen */
  --bun:#e0a44a;        /* varme hveder */
  --good:#3f9b62;
  --line:#dfe2e6;
  --on-desk:#eef2f6;
  --on-desk-dim:#9fb2c4;
  --f-display:"Alfa Slab One", "Rockwell", "Georgia", serif;
  --f-body:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);color:var(--on-desk);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;max-width:460px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px 12px;gap:10px;box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--bun);outline-offset:3px}

/* Top */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.01em;line-height:1}
.brand b{color:var(--holiday);font-weight:400}
.when{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--on-desk-dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.bunbtn{width:30px;height:30px;border:0;background:none;padding:0;border-radius:50%}
.bunbtn svg{width:100%;height:100%;display:block}

/* Bars */
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.dot{height:10px;display:flex;align-items:center;justify-content:center}
.dot i{display:block;border-radius:50%;background:var(--on-desk);transition:transform .15s;transform:scale(0)}
.dot i.s{width:6px;height:6px;transform:scale(1)}
.dot i.l{width:11px;height:11px;transform:scale(1)}
.tube{width:100%;height:44px;border-radius:8px;background:var(--desk-2);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.fill{position:absolute;left:0;right:0;bottom:0;background:var(--on-desk);transition:height .45s cubic-bezier(.3,1.4,.5,1),background .3s}
.fill.danger{background:var(--holiday)}
.tube svg{position:absolute;inset:0;margin:auto;width:26px;height:26px;mix-blend-mode:difference}
.blabel{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--on-desk-dim);font-weight:600;text-align:center;white-space:nowrap}

.hands{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--on-desk-dim);font-weight:600}
.hands .track{flex:1;height:8px;background:var(--desk-2);border-radius:4px;overflow:hidden;position:relative}
.hands .track span{position:absolute;inset:0 auto 0 0;background:var(--bun);transition:width .5s}
.hands output{font-variant-numeric:tabular-nums;color:var(--on-desk);min-width:8.5ch;text-align:right}

/* Card stage */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.sheet-under{position:absolute;width:min(100%,360px);aspect-ratio:3/4;max-height:100%;background:var(--paper);border-radius:6px;opacity:.18;transform:translateY(8px) scale(.96)}
.card{position:relative;width:min(100%,360px);max-height:100%;aspect-ratio:3/4;background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.card.anim{transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .32s}
.rings{height:14px;background:var(--holiday);display:flex;justify-content:space-around;align-items:center;padding:0 22%}
.rings i{width:8px;height:8px;border-radius:50%;background:var(--desk)}
.portrait{flex:0 0 46%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.portrait svg{width:62%;height:auto;max-height:90%}
.choice{position:absolute;top:10px;padding:6px 10px;background:var(--ink);color:var(--paper);font-weight:800;font-size:.85rem;border-radius:3px;max-width:70%;opacity:0;transition:opacity .1s;line-height:1.15}
.choice.l{left:10px;transform:rotate(-4deg)}
.choice.r{right:10px;transform:rotate(4deg);text-align:right}
.body{flex:1;display:flex;flex-direction:column;padding:12px 16px 14px;gap:6px;min-height:0}
.who{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.who h2{margin:0;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.badge{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--holiday);border:1.5px solid var(--holiday);border-radius:3px;padding:1px 5px;white-space:nowrap}
.line{margin:0;font-size:clamp(1rem,4.4vw,1.15rem);line-height:1.35;font-weight:600;text-wrap:pretty}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{border:0;border-radius:6px;padding:12px 10px;background:var(--desk-2);color:var(--on-desk);font-weight:700;font-size:.92rem;line-height:1.2;min-height:52px;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
.actions button span.arrow{font-family:var(--f-display);color:var(--on-desk-dim)}
.actions button:active{background:#33536f}
.foot{font-size:.66rem;color:var(--on-desk-dim);text-align:center;line-height:1.35}

.toast{position:absolute;left:50%;bottom:6px;transform:translate(-50%,10px);background:var(--bun);color:var(--ink);font-weight:800;font-size:.85rem;padding:8px 12px;border-radius:4px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90%;text-align:center;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Screens (start / overgang / slut) */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.panel{width:min(100%,360px);background:var(--paper);color:var(--ink);border-radius:6px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:100%}
.panel .head{background:var(--holiday);color:var(--paper);padding:10px 16px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;display:flex;justify-content:space-between}
.panel .inner{padding:18px 18px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.datebig{display:flex;align-items:flex-end;gap:12px}
.datebig .num{font-family:var(--f-display);font-size:5.4rem;line-height:.82;color:var(--holiday);position:relative}
.datebig .num::after{content:"";position:absolute;left:-6%;right:-6%;top:46%;height:9px;background:var(--ink);transform:rotate(-14deg);border-radius:4px}
.datebig.restored .num::after{display:none}
.datebig .meta{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;line-height:1.3;color:var(--muted)}
.panel h1{font-family:var(--f-display);font-weight:400;font-size:1.9rem;line-height:1.02;margin:0;text-wrap:balance}
.panel p{margin:0;line-height:1.45;font-size:.98rem}
.panel .small{font-size:.78rem;color:var(--muted)}
.cta{border:0;border-radius:6px;background:var(--ink);color:var(--paper);font-weight:800;font-size:1rem;padding:14px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:.82rem;font-variant-numeric:tabular-nums}
.stats div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:3px}
.stats b{font-weight:800}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-height:620px){.portrait{flex-basis:38%}.tube{height:34px}.foot{display:none}}
</style>

// ---------- Kort (fra kortbunken) ----------
// e: [Statskassen, Fagbevægelsen, Kirken, Vælgerne, Hænder]
const C = [

["A2-07","2","Beskæftigelsesministeren","Skal vi stramme dagpengene for at finde hænderne?","Stram","Lad være",[5,-20,0,-5,2500],[0,5,0,0,0]],
["A2-08","2","Finansministeren","Skær i SU'en? Studerende har jo ikke fri alligevel.","Skær","Lad SU'en være",[10,0,0,-10,1500],[-10,0,0,0,0],"Studerende demonstrerer foran Christiansborg."],
["A2-09","2","Finansministeren","Seniorpensionen kunne godt trænge til lidt ... justering.","Juster","Rør den ikke",[5,-15,0,-10,2000],[-5,5,0,0,0]],
["A2-10","2","Økonomen","Hvad med at hæve pensionsalderen et halvt år mere?","Hæv den","Folk er trætte nok",[10,-20,0,-15,3000],[0,0,0,0,0]],
["A2-11","2","Konjunkturen","Beskæftigelsen stiger helt af sig selv. Skal I tage æren?","Tag æren","Vær ydmyg",[0,0,0,10,1500],[0,0,0,0,1500]],
["A2-12","2","Virksomhedsejeren","Kan vi ikke bare give vores folk fri selv?","Lad firmaerne klare det","Det er statens dag",[0,5,-5,0,500],[0,0,5,0,0]],
["A2-13","2","Den skeptiske vælger","Seks ud af ti af os tror ikke på, at det sker.","Bevis det","Vent og se",[-10,0,0,10,0],[0,0,0,-10,0]],
["A2-14","2","Oppositionen","Vi har stillet beslutningsforslag. Kan I ikke bare gøre det nu?","Gør det nu","Det står 2030",[-20,5,5,20,0],[0,0,0,-5,0]],
["A2-15","2","Statsministeren","Det er helt rigtigt, at vi gerne vil være med til at diskutere det.","Diskuter","Stå fast som sidst",[0,0,0,5,0],[0,0,0,-15,0],null,null,true],
["A2-16","2","De Radikales formand","Vi fjernede den, og nu giver vi den tilbage. Det kalder man balance.","Nik","Spørg hvad de mener",[0,0,0,5,0],[-5,0,0,0,0]],
["A2-17","2","Forsvarsministeren","Den indkøbsliste fra 2023? Den er blevet længere.","Køb mere","Vi har en fridag at betale",[-15,0,0,0,0],[5,0,0,-5,0]],
["A2-18","2","Fagbevægelsen","Hvad med de 0,45 procent? Skal de tilbage nu?","Tag dem tilbage","Lad folk beholde dem",[10,-15,0,-5,0],[-10,10,0,5,0]],
["A2-19","2","Biskoppen","Velkommen tilbage. Vi har gemt dagen til jer.","Inviter til pressemøde","Vi klarer det selv",[0,0,15,0,0],[0,0,-5,0,0]],
["A2-20","2","Bageren","Jeg har bagt varme hveder i tre år uden fridag. Skal jeg fortsætte?","Hold ovnen varm","Hold pause til 2030",[0,0,0,5,0],[0,0,0,-5,0]],
["A2-21","2","Folketinget","2030. Lovforslaget er klar. Er de 8.500 hænder fundet?","Vedtag","Udskyd",[-15,10,10,20,0],[0,-10,-10,-20,0]],
["SP-01","S","Christian V's spøgelse","Jeg indførte den i 1686. Hvem har rørt min dag?","Giv ham dagen tilbage","Hvem er du?",[-10,10,10,10,0],[0,0,-10,0,0]],
["SP-02","S","Den gyldne varme hvede","Du har fundet den gyldne varme hvede.","Spis den","Gem den til 2030",[0,5,5,10,0],[0,0,0,0,500]],
["SP-03","S","Moderaternes formand ","Av.","Køl hånden","Lad som ingenting",[0,0,0,-20,0],[0,0,0,-25,0]],
].map(r=>({id:r[0],akt:r[1],fig:r[2],line:r[3],ja:r[4],nej:r[5],ej:r[6],en:r[7],tJa:r[8]||null,tNej:r[9]||null,citat:!!r[10]}));
const byId = Object.fromEntries(C.map(c=>[c.id,c]));

const BARS = [
  {k:"Statskassen",i:P.coin},{k:"Fagbevægelsen",i:P.mega},{k:"Kirken",i:P.church},{k:"Vælgerne",i:P.ballot}
];
const ENDS = {
  "0-lo":["Statskassen er tom","Forsvaret betaler for kampfly med varme hveder."],
  "0-hi":["Pengetanken flyder over","Så mange penge, at selv finansministeren fortryder."],
  "1-lo":["Generalstrejke","Hele landet holder store bededag hver dag."],
  "1-hi":["Fagbevægelsen tager over","De indfører store bededag to gange om året."],
  "2-lo":["Kirkerne lukker","Biskopperne lukker kirkerne i protest. Ingen opdager det før juleaften."],
  "2-hi":["Tolv nye helligdage","Kirken har vundet. Økonomen besvimer."],
  "3-lo":["Valget er tabt","Til en bager."],
  "3-hi":["For populær","Så populær, at du får lov at afskaffe en helligdag mere. Hvilken skal det være?"],
  "bolle":["Regeringen faldt","Den faldt på en bolle. Store bededag overlevede, og du gjorde ikke."],
  "sejr":["Den fjerde fredag er tilbage","2030. Fredagen efter påske er rød i kalenderen igen. Varme hveder til alle."],
  "braendt":["Hånden brændte","Hænderne blev aldrig fundet. Dagen kommer måske i 2034."],
  "udskudt":["Udskudt","Til efter næste valg. Igen."],
};

// ---------- Tilstand ----------
let st;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deck(akt){
  if(akt==="1"){const mid=C.filter(c=>c.akt==="1"&&c.id!=="A1-01"&&c.id!=="A1-18").map(c=>c.id);return ["A1-01",...shuffle(mid),"A1-18"]}
  const mid=C.filter(c=>c.akt==="2"&&!["A2-01","A2-05","A2-21"].includes(c.id)).map(c=>c.id);
  return ["A2-01","A2-05",...shuffle(mid),"A2-21"];
}
function fresh(){return {phase:"start",akt:"1",bars:[50,50,50,50],hands:0,queue:deck("1"),cur:null,count:0,ghost:false,goldTaps:0,goldUsed:false,total:deck("1").length}}
st = fresh();

// ---------- DOM ----------
const $=id=>document.getElementById(id);
const barsEl=$("bars"), stage=$("stage");
BARS.forEach((b,i)=>{
  const d=document.createElement("div");d.className="bar";
  d.innerHTML=`<div class="dot"><i id="dot${i}"></i></div><div class="tube"><div class="fill" id="fill${i}"></div>${b.i}</div><div class="blabel">${b.k}</div>`;
  barsEl.appendChild(d);
});
$("bunbtn").innerHTML=bun(false);

function renderBars(){
  st.bars.forEach((v,i)=>{const f=$("fill"+i);f.style.height=Math.max(0,Math.min(100,v))+"%";f.classList.toggle("danger",v<=15||v>=85)});
  const two=st.akt==="2";$("hands").hidden=!two;
  $("handsfill").style.width=Math.min(100,st.hands/8500*100)+"%";
  $("handsout").textContent=st.hands.toLocaleString("da-DK")+" / 8.500";
  let when="Akt 1 · 2023";
  if(two){const done=st.total-st.queue.length;const y=2026+Math.min(4,Math.floor(done/Math.max(1,st.total)*5));when="Akt 2 · "+y}
  $("when").textContent=when;
}
function showDots(e){for(let i=0;i<4;i++){const d=$("dot"+i);const v=e?Math.abs(e[i]):0;d.className=v===0?"":(v>=15?"l":"s")}}

function toast(msg){let t=stage.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";stage.appendChild(t)}t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2200)}

function clearStage(){[...stage.querySelectorAll(".card,.screen")].forEach(n=>n.remove())}
function setActions(on){$("actions").style.visibility=on?"visible":"hidden"}

// ---------- Skærme ----------
function screen(head,html,btn,fn){
  clearStage();setActions(false);showDots(null);$("under").hidden=true;
  const s=document.createElement("div");s.className="screen";
  s.innerHTML=`<div class="panel"><div class="head">${head}</div><div class="inner">${html}<button class="cta" id="cta">${btn}</button></div></div>`;
  stage.appendChild(s);$("cta").onclick=fn;$("cta").focus({preventScroll:true});
}
function startScreen(){
  st=fresh();renderBars();
  screen("<span>Fredag</span><span>4. efter påske</span>",`
    <div class="datebig"><div class="num">5</div><div class="meta">Maj 2023<br>Store bededag<br>1686 til 2023</div></div>
    <h1>Den Fjerde Fredag</h1>
    <p>Du styrer regeringen. Swipe til venstre eller højre for at svare. Hold Statskassen, Fagbevægelsen, Kirken og Vælgerne i live, og overlev både afskaffelsen og genindførslen.</p>
    <p class="small">Prikkerne over bjælkerne viser, hvad et svar rører ved. De store prikker rører mest.</p>`,
    "Tag fridagen",()=>{st.phase="play";next()});
}
function actTwo(){
  st.akt="2";st.queue=deck("2");st.total=st.queue.length;st.bars=[50,50,50,50];renderBars();
  screen("<span>Et valg senere</span><span>2026</span>",`
    <div class="datebig"><div class="num" style="font-size:3.4rem">2030</div><div class="meta">Måske<br>Hvis tallene<br>går op</div></div>
    <h1>Akt 2: Genindførslen</h1>
    <p>Valgkampen er knap et døgn gammel, og de samme partier vil nu give dagen tilbage. Betingelsen er 8.500 ekstra hænder inden 2030.</p>
    <p class="small">Bjælkerne starter forfra. Hænder-tælleren er ny.</p>`,
    "Lad os diskutere det",()=>{st.phase="play";next()});
}
function ending(key){
  const [h,t]=ENDS[key];const win=key==="sejr";
  st.phase="end";
  screen(win?"<span>Fredag</span><span>Helligdag</span>":"<span>Slut</span><span>"+(st.akt==="1"?"2023":"2026-30")+"</span>",`
    ${win?'<div class="datebig restored"><div class="num">17</div><div class="meta">Maj 2030<br>Store bededag</div></div>':''}
    <h1>${h}</h1><p>${t}</p>
    <div class="stats">${BARS.map((b,i)=>`<div><span>${b.k}</span><b>${Math.round(st.bars[i])}</b></div>`).join("")}<div><span>Kort</span><b>${st.count}</b></div>${st.akt==="2"?`<div><span>Hænder</span><b>${st.hands.toLocaleString("da-DK")}</b></div>`:""}</div>`,
    "Spil igen",()=>{startScreen()});
}

// ---------- Kort ----------
function next(){
  let id;
  if(st.forceNext){id=st.forceNext;st.forceNext=null}
  else{
    if(!st.ghost&&st.count>2&&st.queue.length>1&&Math.random()<0.03){st.ghost=true;id="SP-01"}
    else id=st.queue.shift();
  }
  st.cur=id;showCard(byId[id]);renderBars();
}
function showCard(c){
  clearStage();setActions(true);$("under").hidden=false;
  const f=F[c.fig]||{p:"papir",bg:"#ddd"};
  const el=document.createElement("article");el.className="card";el.tabIndex=0;
  el.setAttribute("aria-label",c.fig.trim()+": "+c.line);
  el.innerHTML=`<div class="rings"><i></i><i></i><i></i></div>
    <div class="portrait" style="background:${f.bg}">${props[f.p]}
      <div class="choice l" id="chL">${c.nej}</div><div class="choice r" id="chR">${c.ja}</div></div>
    <div class="body"><div class="who"><h2>${c.fig.trim()}</h2>${c.citat?'<span class="badge">citat</span>':''}</div><p class="line">${c.line}</p></div>`;
  stage.appendChild(el);
  $("lblL").textContent=c.nej;$("lblR").textContent=c.ja;
  bindDrag(el,c);
}
function bindDrag(el,c){
  let x0=null,dx=0,id=null;
  const set=(x,anim)=>{el.classList.toggle("anim",!!anim);el.style.transform=`translateX(${x}px) rotate(${x/18}deg)`;
    const side=x<-18?"l":x>18?"r":null;$("chL").style.opacity=side==="l"?Math.min(1,(-x-18)/50):0;$("chR").style.opacity=side==="r"?Math.min(1,(x-18)/50):0;
    showDots(side==="l"?c.en:side==="r"?c.ej:null)};
  el.addEventListener("pointerdown",e=>{x0=e.clientX;dx=0;id=e.pointerId;el.setPointerCapture(id);el.classList.remove("anim")});
  el.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;set(dx,false)});
  const up=()=>{if(x0===null)return;x0=null;
    if(dx>80)choose(true,el);else if(dx<-80)choose(false,el);else set(0,true)};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  el.addEventListener("keydown",e=>{if(e.key==="ArrowRight")choose(true,el);if(e.key==="ArrowLeft")choose(false,el)});
  // Hover-preview fra knapper
  const prev=(ja)=>()=>{if(ja){$("chR").style.opacity=1;showDots(c.ej)}else{$("chL").style.opacity=1;showDots(c.en)}};
  const clr=()=>{$("chL").style.opacity=0;$("chR").style.opacity=0;showDots(null)};
  $("btnR").onpointerenter=prev(true);$("btnL").onpointerenter=prev(false);$("btnR").onpointerleave=clr;$("btnL").onpointerleave=clr;
  $("btnR").onclick=()=>choose(true,el);$("btnL").onclick=()=>choose(false,el);
}
let busy=false;
function choose(ja,el){
  if(busy||st.phase!=="play")return;busy=true;
  const c=byId[st.cur];const e=ja?c.ej:c.en;
  el.classList.add("anim");el.style.transform=`translateX(${ja?520:-520}px) rotate(${ja?24:-24}deg)`;el.style.opacity="0";
  showDots(null);
  for(let i=0;i<4;i++)st.bars[i]+=e[i];
  st.hands+=e[4];st.count++;
  renderBars();
  const t=ja?c.tJa:c.tNej;if(t)setTimeout(()=>toast(t),200);
  setTimeout(()=>{busy=false;resolve(c,ja)},340);
}
function resolve(c,ja){
  // Specielle udgange
  if(c.id==="A1-18"){if(ja)return actTwo();return ending("bolle")}
  if(c.id==="A2-21"){if(!ja)return ending("udskudt");if(st.hands>=8500)return ending("sejr");st.forceNext="SP-03";return next()}
  if(c.id==="SP-03")return ending("braendt");
  // Bjælker
  for(let i=0;i<4;i++){if(st.bars[i]<=0)return ending(i+"-lo");if(st.bars[i]>=100)return ending(i+"-hi")}
  next();
}

// Påskeæg: tre tryk på bollen
$("bunbtn").onclick=()=>{
  if(st.phase!=="play"||st.goldUsed)return;
  st.goldTaps++;const b=$("bunbtn");b.animate&&b.animate([{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:220});
  if(st.goldTaps>=3){st.goldUsed=true;st.forceNext="SP-02";$("bunbtn").innerHTML=bun(true);toast("Noget gyldent er på vej ...")}
};

// Bevar spillet ved opdateringer
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>st);
function boot(data){
  if(data&&data.phase==="play"&&data.cur){st=data;renderBars();showCard(byId[st.cur])}
  else startScreen();
}
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data);
})();
</script>
