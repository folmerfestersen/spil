<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fiskekarma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f2e;--navy2:#12324a;--brass:#e9c98a;--brass2:#b8925a;--buoy:#f26b2a;--paper:#f3ead6;--paper2:#fbf5e6;--ink:#17262f;--good:#2c8f6a;--bad:#c8402a;--gold:#e0a82a;--line:#d6c59e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#061520;color:#f3efe6;font-family:Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.slab{font-family:'Alfa Slab One',Rockwell,Georgia,serif;font-weight:400;letter-spacing:.4px}
#app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.6)}
#hud{display:flex;gap:6px;padding:7px 8px;align-items:center;background:linear-gradient(#0e2a3d,#0b1f2e);border-bottom:2px solid var(--brass2);box-shadow:0 2px 0 #06121b;overflow:hidden;position:relative;z-index:2}
.chip{display:flex;align-items:center;gap:5px;background:rgba(4,14,22,.55);border:1px solid rgba(233,201,138,.38);border-radius:8px;padding:4px 8px;font-weight:800;font-size:13px;white-space:nowrap;color:#f6ecd6}
.chip svg{width:15px;height:15px;stroke:var(--brass);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#karmaChip{flex:1;min-width:0;gap:6px}
#karmaBar{flex:1;height:8px;border-radius:8px;background:linear-gradient(90deg,#c8402a,#e0a03a 45%,#e9e3c9 50%,#8cc76a 55%,#2c8f6a);position:relative;min-width:36px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
#karmaMark{position:absolute;top:-5px;width:6px;height:18px;border-radius:2px;background:var(--brass);box-shadow:0 0 0 1.5px #0b1f2e;transform:translateX(-50%)}
#wrap{flex:1;position:relative;min-height:0;background:#0b1f2e}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
#toasts{position:absolute;left:0;right:0;top:36px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:5;padding:0 10px}
.toast{background:rgba(9,24,36,.92);color:#fbf5e6;border-radius:8px;padding:7px 13px;font-weight:700;font-size:13.5px;max-width:94%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:tin .25s ease-out;border:1px solid rgba(233,201,138,.45);border-left:4px solid var(--brass)}
.toast.good{border-left-color:#4fc08a}.toast.bad{border-left-color:#f06a4a}.toast.gold{border-left-color:#ffd24a;background:rgba(50,34,4,.94)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.rope{height:7px;background:repeating-linear-gradient(115deg,#d2b074 0 7px,#9a7440 7px 10px);box-shadow:inset 0 -2px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
#controls{background:linear-gradient(#12324a,#0b1f2e);padding:9px 8px calc(8px + env(safe-area-inset-bottom))}
#lureLine{font-size:12.5px;font-weight:800;color:var(--brass);margin:0 2px 7px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden}
#lureLine span{overflow:hidden;text-overflow:ellipsis}
#mainBtn{width:100%;height:60px;border:0;border-radius:12px;background:linear-gradient(#ff8a45,#e85a1c);color:#fff;font-family:'Alfa Slab One',Rockwell,Georgia,serif;font-size:19px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 5px 0 #9a3a0c,inset 0 2px 0 rgba(255,255,255,.35),inset 0 -14px 18px rgba(0,0,0,.12);touch-action:none}
#mainBtn:active,#mainBtn.held{transform:translateY(3px);box-shadow:0 2px 0 #9a3a0c,inset 0 2px 0 rgba(255,255,255,.3)}
#mainBtn.bite{background:linear-gradient(#f04a3a,#c0201c);box-shadow:0 5px 0 #7a1210,inset 0 2px 0 rgba(255,255,255,.35);animation:pulse .35s infinite alternate}
#mainBtn.wait{background:linear-gradient(#3a86a8,#1f5f80);box-shadow:0 5px 0 #123f58,inset 0 2px 0 rgba(255,255,255,.3)}
#mainBtn.fight{background:linear-gradient(#3aa87a,#1f7a56);box-shadow:0 5px 0 #124a34,inset 0 2px 0 rgba(255,255,255,.3)}
@keyframes pulse{to{transform:scale(1.03)}}
#snagBtns{display:none;grid-template-columns:1fr 1fr;gap:8px}
#snagBtns button{height:60px;border:0;border-radius:12px;font-family:'Alfa Slab One',Rockwell,Georgia,serif;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
#nav button{border:1px solid rgba(233,201,138,.3);border-radius:10px;background:linear-gradient(rgba(255,255,255,.07),rgba(0,0,0,.18));color:#f6ecd6;font-family:Nunito;font-weight:800;font-size:11.5px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
#nav button svg{width:22px;height:22px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button:active{transform:translateY(2px);box-shadow:none}
#nav button.dim{opacity:.4}
#modal{position:fixed;inset:0;background:rgba(3,10,16,.66);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background-color:var(--paper);background-image:linear-gradient(rgba(40,90,120,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(40,90,120,.07) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);width:100%;max-width:620px;max-height:90dvh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 30px rgba(0,0,0,.5)}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:14px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh{flex:none;display:flex;align-items:center;padding:11px 12px 10px 16px;gap:10px;background:linear-gradient(#143a55,#0b1f2e);color:var(--brass)}
.sh h2{margin:0;flex:1;font-family:'Alfa Slab One',Rockwell,Georgia,serif;font-weight:400;font-size:21px;line-height:1.1;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.x{border:0;border-radius:50%;width:36px;height:36px;font-size:15px;font-weight:900;color:#0b1f2e;background:radial-gradient(circle,#fbf5e6 0 46%,transparent 47%),repeating-conic-gradient(#d2402a 0 45deg,#fbf5e6 45deg 90deg);box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(0,0,0,.25)}
.sb{overflow:auto;padding:10px 14px 18px;-webkit-overflow-scrolling:touch}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;background:#0b1f2e;border-top:1px solid rgba(233,201,138,.25)}
.tabs button{border:1px solid rgba(233,201,138,.5);border-radius:6px;padding:6px 11px;font-weight:800;font-family:Nunito;background:transparent;color:var(--brass);white-space:nowrap;font-size:13px}
.tabs button.on{background:var(--brass);color:#0b1f2e}
.row{display:flex;gap:10px;align-items:center;background:var(--paper2);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;margin:8px 0;box-shadow:0 2px 0 var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t small{display:block;opacity:.78;font-size:12.5px;line-height:1.3}
.row.on{border-color:var(--buoy);box-shadow:0 2px 0 var(--buoy),0 0 0 1px var(--buoy) inset}
.row.off{opacity:.55}
.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:800;font-family:Nunito;background:#17384f;color:#fbf5e6;font-size:13.5px;white-space:nowrap;box-shadow:0 3px 0 #08141d,inset 0 1px 0 rgba(255,255,255,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #08141d}
.btn.o{background:var(--buoy);box-shadow:0 3px 0 #9a3a0c,inset 0 1px 0 rgba(255,255,255,.3)}.btn.g{background:var(--good);box-shadow:0 3px 0 #145238,inset 0 1px 0 rgba(255,255,255,.25)}.btn.r{background:var(--bad);box-shadow:0 3px 0 #7a1e10,inset 0 1px 0 rgba(255,255,255,.25)}.btn.l{background:#e4d6b4;color:var(--ink);box-shadow:0 3px 0 #b9a77c,inset 0 1px 0 rgba(255,255,255,.5)}
.btn:disabled{opacity:.4}
.btn.big{width:100%;padding:13px;font-size:16px;border-radius:10px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px;margin:1px 2px 1px 0;color:#fff;background:#5f7480;vertical-align:1px}
.tag.bad{background:var(--bad)}.tag.good{background:var(--good)}.tag.gold{background:var(--gold);color:#3a2a00}
.price{font-weight:800;text-align:right;white-space:nowrap}
.price s{opacity:.5;font-weight:700;font-size:12px;display:block}
h3{font-family:'Alfa Slab One',Rockwell,Georgia,serif;font-weight:400;margin:16px 0 2px;font-size:16px;letter-spacing:.4px;color:#17384f;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--brass2) 0 8px,transparent 8px 13px)}
p{margin:6px 0;line-height:1.45}
.note{background:rgba(23,56,79,.08);border-left:4px solid #17384f;padding:8px 10px;border-radius:4px;font-size:13.5px;margin:8px 0}
.note.bad{background:rgba(200,64,42,.11);border-color:var(--bad)}.note.good{background:rgba(44,143,106,.12);border-color:var(--good)}
.thumb{width:64px;height:40px;flex:none}
.card{text-align:center}
.card img{width:100%;max-width:300px;height:auto;background:radial-gradient(ellipse at 50% 35%,#bfe0e6,#5d9db0 70%,#2f6e86);border-radius:10px;border:3px solid #17384f;box-shadow:0 3px 0 #08141d}
.card .nm{font-family:'Alfa Slab One',Rockwell,Georgia,serif;font-size:23px;line-height:1.1;margin:10px 0 4px;color:#17384f}
.stats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.stats div{background:var(--paper2);border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:800;font-size:14px}
.stats div small{display:block;font-weight:700;opacity:.6;font-size:11px}
.logg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.lc{background:var(--paper2);border:1.5px solid var(--line);border-radius:8px;padding:5px;text-align:center;font-size:11.5px;font-weight:800;line-height:1.15;box-shadow:0 2px 0 var(--line)}
.lc img{width:100%;height:auto;display:block}
.lc.no{opacity:.6}
.slot{display:flex;gap:8px;justify-content:center;margin:12px 0;background:#8a2420;padding:12px;border-radius:12px;border:3px solid #17262f;box-shadow:inset 0 3px 0 rgba(255,255,255,.2)}
.reel{width:76px;height:86px;background:#fbf5e6;border-radius:8px;border:3px solid #17262f;font-size:46px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -12px 16px rgba(0,0,0,.18),inset 0 12px 16px rgba(0,0,0,.12)}
.cbx{width:24px;height:24px;flex:none;accent-color:var(--buoy)}
.cap{height:10px;border-radius:8px;background:rgba(27,42,51,.14);overflow:hidden;margin:4px 0 8px}
.cap i{display:block;height:100%;background:var(--good)}
.kbar{height:12px;border-radius:8px;background:linear-gradient(90deg,#c8402a,#e0a03a 45%,#e9e3c9 50%,#8cc76a 55%,#2c8f6a);position:relative;margin:6px 0}
.kbar i{position:absolute;top:-4px;width:6px;height:20px;background:#17262f;border-radius:3px;transform:translateX(-50%)}
ul{margin:6px 0;padding-left:20px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip" id="moneyChip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 16V8M9.5 12l5-4M9.5 12l5 4"/></svg><span id="money">0</span></div>
    <div class="chip" id="karmaChip"><span id="karmaFace">😐</span><div id="karmaBar"><div id="karmaMark"></div></div></div>
    <div class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z"/></svg><span id="pol">0</span></div>
    <div class="chip"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3 13h18M8 9V6h8v3"/></svg><span id="cool">0</span></div>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="toasts"></div>
  </div>
  <div class="rope"></div>
  <div id="controls">
    <div id="lureLine"><span id="lureTxt"></span><span id="rodTxt"></span></div>
    <button id="mainBtn">Hold for at kaste</button>
    <div id="snagBtns">
      <button id="rykBtn" style="background:#2f6f8f;box-shadow:0 5px 0 #1a4a62">💪 Ryk!</button>
      <button id="klipBtn" style="background:#d2462f;box-shadow:0 5px 0 #8a2a1a">✂️ Klip linen</button>
    </div>
    <div id="nav">
      <button data-p="gear"><svg viewBox="0 0 24 24"><path d="M14 3v11a5 5 0 0 1-10 0v-2l3 3"/><circle cx="14" cy="3" r="1.3"/></svg>Grej</button>
      <button data-p="map"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 5.5l2.6 6.5L12 18.5 9.4 12z"/></svg>Kort</button>
      <button data-p="bag"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3 13h18M8 9V6h8v3"/></svg>Køleboks</button>
      <button data-p="shop"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Butik</button>
      <button data-p="nets"><svg viewBox="0 0 24 24"><path d="M3 9l6-6M3 15L15 3M3 21 21 3M9 21 21 9M15 21l6-6M3 9l12 12M3 15l6 6M9 3l12 12M15 3l6 6M3 3l18 18"/></svg>Garn</button>
      <button data-p="log"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h6v16H6a2 2 0 0 0-2 2zM20 5a2 2 0 0 0-2-2h-6v16h6a2 2 0 0 1 2 2z"/></svg>Logbog</button>
      <button data-p="kro"><svg viewBox="0 0 24 24"><path d="M5 9h10v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2zM15 11h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2M6 9a2.5 2.5 0 0 1 4-2.5A3 3 0 0 1 15 8"/></svg>Kro</button>
      <button data-p="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/></svg>Mere</button>
    </div>
  </div>
</div>
<div id="modal"><div class="sheet"><div class="sh"><h2 id="mt"></h2><button class="x" id="mx">✕</button></div><div class="tabs" id="mtabs"></div><div class="sb" id="mb"></div></div></div>
<script>
// ================= DATA =================
const SP = {};
function sp(id, n, kind, c, L, k, ppk, o) {
  SP[id] = Object.assign({ id, n, kind, c, L, k, ppk, meth: ['madding'], fav: [], band: [.8, 1], fight: 1, bite: 1, txt: '', grp: 'fisk' }, o || {});
}
// ---- Havdyr ----
sp('strandkrabbe', 'Strandkrabbe', 'crab', ['#4f6b3a', '#c9a24a', '#33452a'], [3, 8], .25, 25, { grp: 'dyr', kr: 1, grab: 1, fight: .3, band: [.95, 1], fav: ['musling', 'sild'], minV: 1, bite: 1.4, txt: "Havnens mest dedikerede maddingtyv. Jytte giver en krone stykket til suppen, og det er mest af medlidenhed." });
sp('eremitkrebs', 'Eremitkrebs', 'hermit', ['#c8643c', '#e8d6b0', '#8a3d22'], [2, 6], .3, 10, { grp: 'dyr', kr: 1, grab: 1, fight: .2, band: [.95, 1], fav: ['musling'], minV: 6, txt: "Bor til leje i et sneglehus. Betaler ingen husleje." });
sp('svoemmekrabbe', 'Svømmekrabbe', 'crab', ['#5a5a7a', '#d0b98a', '#3c66a8'], [4, 9], .22, 40, { grp: 'dyr', kr: 1, grab: 1, fight: .45, band: [.9, 1], fav: ['sild', 'musling'], minV: 14, txt: "Har padler på bagbenene og et temperament som en gårdhund." });
sp('taskekrabbe', 'Taskekrabbe', 'crab', ['#b5653a', '#e9c79a', '#3a1e12'], [8, 25], .12, 90, { grp: 'dyr', kr: 1, grab: 1, fight: .5, band: [.95, 1], fav: ['sild', 'musling'], txt: "Ligner en rødbrun tærte med kampsportsuddannelse." });
sp('hummer', 'Hummer', 'lobster', ['#1f3d6b', '#3a5f8f', '#0e1f38'], [15, 50], .026, 350, { grp: 'dyr', m: { B: 21, K: 22, N: 24 }, grab: 1, kr: 1, fight: .6, band: [.95, 1], fav: ['sild'], bite: .6, txt: "Blå indtil den møder en gryde. Mindstemålet måles her i hel længde." });
sp('jomfruhummer', 'Jomfruhummer', 'lobster', ['#e8957a', '#f6c9b4', '#b8583e'], [8, 22], .015, 300, { grp: 'dyr', m: { K: 10.5, N: 10.5 }, grab: 1, fight: .3, band: [.97, 1], fav: ['sild'], txt: "Kaldes ‘danske langustiner’ af folk, der gerne vil sælge dem dyrere." });
sp('reje', 'Roskildereje', 'shrimp', ['#d9cfb8', '#efe7d6', '#b09a7a'], [2, 6], .1, 150, { grp: 'dyr', grab: 1, kr: 1, fight: .1, band: [.6, 1], minV: 3, bite: .3, txt: "Lille, gennemsigtig og fuldstændig uimponeret af dig." });
sp('soestjerne', 'Søstjerne', 'star', ['#e0703a', '#f2a46a', '#b44a22'], [5, 25], .03, 5, { grp: 'dyr', kr: 1, grab: 1, fight: .05, band: [.97, 1], fav: ['musling'], minV: 3, txt: "Spiser muslinger ved at vende maven ud af kroppen. God morgen." });
sp('soepindsvin', 'Søpindsvin', 'urchin', ['#7a2a5a', '#a14c7d', '#3e0f2c'], [3, 8], .4, 120, { grp: 'dyr', grab: 1, fight: .05, band: [.97, 1], bite: .4, noma: 1, txt: "Noma betaler godt for rognen. Dine fingre betaler for piggene." });
sp('brandmand', 'Brandmand', 'jelly', ['#c0392b', '#e8735f', '#7a1b12'], [10, 50], .05, 0, { grp: 'dyr', grab: 1, fight: .05, band: [0, .6], noSale: 1, bite: .5, meth: ['madding', 'blink', 'pirk', 'flue'], txt: "Den svier. Den svier virkelig. Ingen køber den." });
sp('oeregople', 'Øregople', 'jelly', ['#cfd8f0', '#e8c7e8', '#9da7d0'], [5, 30], .05, 0, { grp: 'dyr', grab: 1, fight: .03, band: [0, .7], noSale: 1, bite: .6, meth: ['madding', 'blink', 'pirk', 'flue'], txt: "98 % vand, 2 % irritation. Brænder ikke, men glider." });
sp('blaamusling', 'Blåmusling', 'mussel', ['#22253a', '#3b3f5e', '#5b6a9a'], [3, 8], .15, 30, { grp: 'dyr', kr: 1, grab: 1, fight: .05, band: [.97, 1], bite: .4, minV: 3, meth: ['madding', 'blink', 'pirk'], txt: "Hang bare fast på krogen. Ligesom din onkel til en fest." });
sp('oesters', 'Stillehavsøsters', 'mussel', ['#8a8a7a', '#c9c4b0', '#5a5a4a'], [8, 25], .08, 120, { grp: 'dyr', kr: 1, grab: 1, fight: .05, band: [.97, 1], bite: .3, invasive: 1, meth: ['madding', 'blink', 'pirk'], txt: "Invasiv art. Tag den med hjem – havet takker dig." });
sp('blaeksprutte', 'Ottearmet blæksprutte', 'octo', ['#b0603a', '#d99a74', '#6a3218'], [15, 60], .02, 120, { grp: 'dyr', fight: .8, band: [.8, 1], fav: ['sild', 'reje'], meth: ['madding', 'pirk', 'blink'], bite: .6, txt: "Otte arme, tre hjerter, nul respekt for dit grej." });

function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }
function mixHex(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (AC && AC.state === 'suspended') AC.resume().catch(() => { }); return AC; }
function tone(f, d, type, v, slide, delay) {
  if (!G.sound) return; const a = ac(); if (!a) return;
  try {
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(v || .07, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
  } catch (e) { }
}
function noise(d, v, freq) {
  if (!G.sound) return; const a = ac(); if (!a) return;
  try {
    const b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const s = a.createBufferSource(); s.buffer = b; const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq || 900;
    const g = a.createGain(); g.gain.value = v || .15; s.connect(fl).connect(g).connect(a.destination); s.start();
  } catch (e) { }
}
function sfx(n) {

    case 'cast': noise(.35, .08, 2500); break;
    case 'splash': noise(.4, .2, 700); break;
    case 'bite': tone(880, .1, 'square', .05); tone(1320, .12, 'square', .05, 0, .1); break;
    case 'snap': tone(320, .25, 'sawtooth', .06, -250); break;
    case 'coin': tone(1300, .08, 'square', .04); tone(1750, .12, 'square', .04, 0, .07); break;
    case 'catch': [523, 659, 784, 1046].forEach((f, i) => tone(f, .15, 'triangle', .07, 0, i * .08)); break;
    case 'bad': tone(260, .35, 'triangle', .08, -120); break;
    case 'good': tone(660, .1, 'sine', .07); tone(990, .15, 'sine', .07, 0, .09); break;
    case 'tick': tone(2200, .015, 'square', .012); break;
    case 'ryk': noise(.15, .15, 400); break;

}

function bestBoat() { let r = 0; for (const id of ['gummibaad', 'jolle', 'kutter']) if (G.own[id]) r = Math.max(r, IT[id].rank); return r; }
function coolCap() { let c = 4; for (const id of ['koel25', 'koel60', 'lastrum']) if (G.own[id]) c = Math.max(c, IT[id].cap); return c; }
function cw(it) { return it.st === 'filet' ? it.w * (it.q === 0 ? .5 : .4) : it.st === 'frik' ? it.w * .5 : it.w; }
function coolLoad() { return G.items.reduce((a, it) => a + (it.st === 'whole' && SP[it.id] && SP[it.id].fredet ? 0 : cw(it)), 0); }
function minFor(s, reg) { const m = s.m; if (!m) return 0; if (typeof m === 'number') return m; return m[reg] || 0; }
function priceMult() { return 1 - G.karma / 250; }
function priceOf(id) { const p = IT[id].price; return p ? Math.round(p * priceMult()) : 0; }
function lureInWater() { return R.state === 'water' || R.state === 'bite' || R.state === 'fight' || R.state === 'snag'; }
function sunElev() { return Math.sin((G.time - .25) * Math.PI * 2); }
function isNight() { return sunElev() < -.12; }
function isDusk() { return Math.abs(sunElev()) < .22; }
function clock() { const m = Math.floor(G.time * 24 * 60); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function itemValue(it) {
  const s = SP[it.id];
  if (s.kind === 'weed') return s.useless ? 0 : it.w * s.noma * (G.nomaWish === it.id ? 3 : 1);
  if (it.st === 'frik') return Math.max(2, Math.round(it.w * (s.ppk || 40) * .45));
  if (it.st === 'filet') return it.w * s.ppk * (it.q === 0 ? .3 : .55);
  if (s.mammal) return it.w * 60;
  if (s.noSale) return 0;
  const vm = it.v ? VAR[it.v].mult : 1;
  return Math.max(s.minV || 1, it.w * s.ppk * vm);
}
function buyerOf(it) {
  const s = SP[it.id];
  if (it.st === 'weed') return s.useless ? null : 'noma';
