<style>
:root{

  --bg:#17111c; --panel:#2b2030; --panel-2:#3a2b3d; --line:#0b070e; --ink:#f6ead2; --muted:#b4a088;

  --t1:#e8e0d0; --t2:#6fb1e8; --t3:#b07ae8; --t4:#e5533d;

  --body:"VT323", ui-monospace, Menlo, monospace;
  --s:2;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:22px;line-height:1.1;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none}
#app{height:100%;display:grid;place-items:center}
#stage{position:relative;width:calc(400px*var(--s));height:calc(225px*var(--s));max-width:100%;touch-action:none}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
  box-shadow:0 0 0 4px var(--line),0 0 0 8px var(--panel-2)}
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--display);font-size:calc(var(--s)*4.5px);color:var(--ink)}
#hud .left{position:absolute;left:calc(var(--s)*6px);top:calc(var(--s)*6px);display:flex;flex-direction:column;gap:calc(var(--s)*3px)}
.bar{position:relative;width:calc(var(--s)*86px);height:calc(var(--s)*10px);background:var(--line);border:calc(var(--s)*1px) solid var(--line);box-shadow:0 0 0 calc(var(--s)*1px) #5a4658}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--red);box-shadow:inset 0 calc(var(--s)*-2px) 0 rgba(0,0,0,.25)}
.bar.xp{height:calc(var(--s)*7px)} .bar.xp i{background:var(--green)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*4px);text-shadow:calc(var(--s)*.5px) calc(var(--s)*.5px) 0 #000}
.pant{display:flex;align-items:center;gap:calc(var(--s)*3px);text-shadow:calc(var(--s)*.5px) calc(var(--s)*.5px) 0 #000}
.pant canvas{width:calc(var(--s)*6px);height:calc(var(--s)*9px);image-rendering:pixelated}
#hud .mid{position:absolute;left:50%;top:calc(var(--s)*5px);transform:translateX(-50%);text-align:center;text-shadow:calc(var(--s)*.6px) calc(var(--s)*.6px) 0 #000}
#hud .mid b{display:block;font-weight:400;font-size:calc(var(--s)*9px);margin-top:calc(var(--s)*3px);color:var(--accent)}
#pauseBtn{position:absolute;right:calc(var(--s)*6px + env(safe-area-inset-right,0px));top:calc(var(--s)*6px);pointer-events:auto;font-family:var(--display);font-size:calc(var(--s)*4px);
  background:var(--panel);color:var(--ink);border:calc(var(--s)*1px) solid var(--line);padding:calc(var(--s)*3px) calc(var(--s)*4px);cursor:pointer}
#bossBar{position:absolute;left:50%;bottom:calc(var(--s)*8px);transform:translateX(-50%);text-align:center;font-size:calc(var(--s)*4px);text-shadow:1px 1px 0 #000}
#bossBar .bar{width:calc(var(--s)*200px);margin-top:calc(var(--s)*2px)} #bossBar .bar i{background:var(--accent)}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:calc(var(--s)*8px);color:var(--accent);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #000;white-space:nowrap;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

  padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

.screen.clear{background:rgba(12,8,16,.35)}
.wrap{width:min(1240px,100%);margin:auto;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:4px solid var(--line);box-shadow:inset 4px 4px 0 rgba(255,255,255,.05),inset -4px -4px 0 rgba(0,0,0,.3);padding:18px}

h2{font-size:clamp(14px,2.4vw,22px);color:var(--accent);line-height:1.4}
h3{font-size:12px;line-height:1.5}
p{margin:0}
.muted{color:var(--muted)}
.btn{font-family:var(--display);font-size:12px;line-height:1.3;background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);padding:11px 14px;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.22),0 4px 0 var(--line);cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.22),0 2px 0 var(--line)}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{background:#4a3d48;color:#8d7f86;cursor:not-allowed;filter:none}
.btn:focus-visible,button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.title-hero{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;padding-block:24px}
.title-hero p{font-size:26px;max-width:36ch}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:20px;color:var(--muted)}
.keys kbd{font-family:var(--display);font-size:10px;background:var(--panel-2);border:2px solid var(--line);padding:4px 6px;color:var(--ink);margin-right:6px}

.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.char.locked .portrait{background:#1d1520}
.char.locked h2{color:var(--muted)}
.unlock{font-family:var(--display);font-size:12px;color:var(--green);line-height:1.5}
.char{display:flex;flex-direction:column;gap:10px;min-width:0}

.char .job{color:var(--muted);font-size:22px}
.tag{display:inline-block;font-family:var(--display);font-size:9px;padding:4px 6px;background:var(--panel-2);border:2px solid var(--line);color:var(--accent)}
.statlist{margin:0;padding:0;list-style:none;font-size:21px}

.pos{color:var(--green)} .neg{color:var(--red)}

.shop{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}

.offers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.tier1{border-color:var(--t1)} .tier2{border-color:var(--t2)} .tier3{border-color:var(--t3)} .tier4{border-color:var(--t4)}

.card .lines{font-size:19px;line-height:1.05}
.card .buy{margin-top:auto;display:flex;gap:6px}
.card .buy .btn{flex:1;font-size:11px;padding:9px 6px}
.lock{font-family:var(--display);font-size:9px;background:transparent;color:var(--muted);border:2px solid #5a4658;padding:6px;cursor:pointer}
.lock[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--line)}
.inv{display:flex;flex-wrap:wrap;gap:8px}
.slot{width:52px;height:52px;border:3px solid var(--line);background:#1d1520;display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.slot img{image-rendering:pixelated;max-width:40px;max-height:40px}
.slot.empty{border-style:dashed;border-color:#4a3a48;cursor:default}
.slot.sel{outline:3px solid var(--accent);outline-offset:2px}
.slot .n{position:absolute;right:1px;bottom:0;font-family:var(--display);font-size:8px;color:var(--ink);text-shadow:1px 1px 0 #000}
.sel-panel{margin-top:10px;background:var(--panel-2);border:3px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.pantbig{font-family:var(--display);font-size:14px;color:var(--green);display:flex;align-items:center;gap:8px}
.pantbig img{image-rendering:pixelated;width:12px;height:18px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.choice{font-family:var(--body);font-size:26px;text-align:left;background:var(--panel-2);color:var(--ink);border:3px solid var(--line);padding:16px;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.choice b{display:block;font-family:var(--display);font-weight:400;font-size:14px;color:var(--green);margin-bottom:8px}
.choice:hover{background:#4a3850}
.center{text-align:center;align-items:center}
.ball img{width:84px;height:84px;image-rendering:pixelated;animation:wob .5s steps(2) infinite}
@keyframes wob{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.ball img{animation:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

{const c=S.sig_dark.i,g=c.getContext('2d');g.globalCompositeOperation='source-in';g.fillStyle='#3a2b3d';g.fillRect(0,0,c.width,c.height);}

function ell(g,cx,cy,rx,ry,col){g.fillStyle=col;for(let dy=-ry;dy<=ry;dy++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(dy/ry)*(dy/ry))));g.fillRect(cx-w,cy+dy,w*2+1,1);}}
function drawBoss(g,frame){
  const px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
  const F='#e8a48e',F2='#cf8672',F3='#b06a5a',VR='#8a1f3a',VB='#5a5a9a';
  // bare uneven legs
  [[10,0],[18,1],[27,0],[36,1],[45,0]].forEach(([x],i)=>{const y=(i+frame)%2?45:44;px(x-1,y-10,4,11,K);px(x,y-10,2,10,i%2?F2:F);px(x-2,y,5,2,K);px(x-1,y,3,1,F3);});
  // arms
  px(0,22,11,4,K);px(1,23,9,2,F);px(0,10,3,14,K);px(1,11,1,12,'#26242c');
  px(46,24,10,4,K);px(47,25,8,2,F2);g.drawImage(S.kamera.i,48,18);
  px(4,34,8,3,K);px(5,35,6,1,F2);g.drawImage(S.salmebog.i,1,32);
  // necks fused into the body
  [[9,11],[25,6],[41,12]].forEach(([x,y])=>{px(x-1,y,8,14,K);px(x,y,6,14,F);px(x+1,y+2,1,9,VR);});
  ell(g,17,18,6,3,K);ell(g,17,18,5,2,F);ell(g,39,18,6,3,K);ell(g,39,18,5,2,F);
  // flesh blob
  ell(g,28,31,26,13,K);ell(g,28,31,25,12,F);ell(g,28,36,22,7,F2);ell(g,30,26,14,4,'#f0b8a4');
  const inBlob=(x,y)=>((x-28)/24)**2+((y-31)/11)**2<1;
  const R=rng(5+frame*0);
  for(let v=0;v<9;v++){g.fillStyle=v%3?VR:VB;let x=8+Math.floor(R()*40),y=22+Math.floor(R()*16);
    for(let st=0;st<16;st++){if(inBlob(x,y))g.fillRect(x,y,1,1);x+=Math.floor(R()*3)-1;y+=Math.floor(R()*3)-1;}}
  // boils
  [[13,27],[42,33],[20,39],[46,27],[34,25]].forEach(([x,y])=>{px(x-1,y-1,3,3,'#d8c060');px(x,y-1,1,1,'#fff6c0');px(x-1,y+1,3,1,'#b89a40');});
  // navel
  px(38,37,2,2,F3);
  // belly mouth
  px(21,29,14,8,K);px(22,30,12,6,'#5a0a1a');for(let i=0;i<6;i++){px(22+i*2,30,1,2,'#f4f0d8');px(23+i*2,34,1,2,'#f4f0d8');}
  px(25,37,1,3+frame,'#c8e080');px(30,37,1,2+(1-frame)*2,'#c8e080');
  // bloodshot extra eyes
  [[11,34],[45,31],[29,41]].forEach(([x,y])=>{ell(g,x,y,2,2,K);px(x-1,y-1,3,3,'#fff');px(x+1,y-1,1,1,'#e5533d');px(x,y,1,1,frame?'#e5533d':'#2b3e63');});
  // faces
  g.drawImage(S.seb.i,0,0,16,10,3,7+frame,16,10);
  g.drawImage(S.mik.i,0,0,16,10,36,8-frame,16,10);
  g.drawImage(S.mat.i,0,0,16,10,20,1,16,10);
  // veins on faces
  g.fillStyle=VR;[[6,12],[7,13],[44,14],[45,13],[23,7],[24,8],[33,6]].forEach(([x,y])=>g.fillRect(x,y,1,1));
}
canvasSprite('boss',56,47,g=>drawBoss(g,0));
canvasSprite('boss2',56,47,g=>drawBoss(g,1));

const iconCache={};
function iconURL(name){
  if(iconCache[name])return iconCache[name];
  const s=S[name];const sc=Math.max(1,Math.floor(40/Math.max(s.w,s.h)));
  const c=document.createElement('canvas');c.width=s.w*sc;c.height=s.h*sc;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(s.i,0,0,c.width,c.height);
  return iconCache[name]=c.toDataURL();
}

function drawText(str,x,y,col,noShadow){
  str=String(str).toUpperCase();const w=str.length*4-1;const sx=Math.round(x-w/2);y=Math.round(y);
  for(const pass of noShadow?[1]:[0,1]){
    ctx.fillStyle=pass?col:'#1a1020';
    for(let i=0;i<str.length;i++){const g=FONT[str[i]];if(!g)continue;
      for(let p=0;p<15;p++)if(g[p]==='1'){const px=sx+i*4+(p%3),py=y+Math.floor(p/3);ctx.fillRect(pass?px:px+1,pass?py:py+1,1,1);}}
  }
}
function bubble(text,x,y){
  const w=String(text).length*4+5,h=9,bx=Math.round(x-w/2),by=Math.round(y-h);
  ctx.fillStyle=K;ctx.fillRect(bx-1,by-1,w+2,h+2);ctx.fillStyle='#fff';ctx.fillRect(bx,by,w,h);
  ctx.fillStyle=K;ctx.fillRect(Math.round(x)-1,by+h+1,3,1);ctx.fillStyle='#fff';ctx.fillRect(Math.round(x),by+h,1,2);
  drawText(text,x,by+2,'#c8301e',true);
}

function nearestEnemy(x,y,range){let best=null,bd=Infinity;for(const e of G.enemies){if(e.dead||e.immune)continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<range&&d<bd){bd=d;best=e;}}return best;}

function hitEnemy(e,dmg,crit,kx,ky,opt){
  if(e.dead||e.immune)return;opt=opt||{};
  const c=Math.random()<crit;const d=Math.max(1,Math.round(dmg*(c?2:1)));
  e.hp-=d;if(!(e.fcd>0)){e.flash=0.06;e.fcd=e.boss?0.25:0.14;}
  const kf=e.boss?0.08:e.neutral?0:1;e.kbx+=(kx||0)*kf;e.kby+=(ky||0)*kf;
  if(opt.slow)e.slow=Math.max(e.slow,opt.slow);
  if(opt.stun&&!e.boss)e.stun=Math.max(e.stun,opt.stun);
  if(opt.psn){e.psnT=3;e.psnDps=Math.max(e.psnDps,opt.psn);}
  fx({k:'n',x:e.x+rand(-3,3),y:e.y-e.r-2,v:d,c:c?'#f2c94c':'#ffffff',life:0.55});
  if(G.stats.steal>0&&G.stealCd<=0&&Math.random()*100<G.stats.steal){heal(1);G.stealCd=0.12;}
  sfx('hit');
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return;

  const drop=(px,py,k)=>G.pick.push({k,x:px+rand(-8,8),y:py+rand(-8,8),vx:rand(-50,50),vy:rand(-50,50)});
  if(e.neutral){
    const n=ri(2,4);for(let i=0;i<n;i++)drop(e.x,e.y,'pant');
    if(Math.random()<0.6)drop(e.x,e.y,'bajer');
    if(Math.random()<0.12*(1+G.stats.luck/100))drop(e.x,e.y,'gacha');
    return;
  }
  G.kills++;
  const base=e.drop*0.7;let n=Math.floor(base);if(Math.random()<base-n)n++;
  if(Math.random()<G.stats.luck/300)n++;

  if(Math.random()<0.01*(1+G.stats.luck/100))drop(e.x,e.y,'bajer');
  if(e.elite){drop(e.x,e.y,'egacha');drop(e.x,e.y,'bajer');}
  if(e.type==='maelk'){for(let i=0;i<2;i++)makeEnemy('draabe',e.x+rand(-8,8),e.y+rand(-6,6));}
  if(e.king){G.boss=null;G.ended=true;G.enemies.forEach(o=>{if(!o.dead&&o!==e){o.dead=true;parts(o.x,o.y,o.parts,6,80);}});G.eproj=[];G.emotos=[];G.clouds=[];setTimeout(()=>{if(G&&state==='play')endWave();},1400);}
  else if(e===G.boss)G.boss=null;
}

// ---------- weapons ----------
function fire(w,d,st,tgt){
  const ang=Math.atan2(tgt.y-w.hy,tgt.x-w.hx),ca=Math.cos(ang),sa=Math.sin(ang);
  switch(d.kind){
    case 'melee':{
      w.anim=1;w.la=ang;sfx('swing');
      fx({k:'swipe',x:w.hx,y:w.hy,a:ang,r:st.range*0.75,life:0.16});
      for(const e of G.enemies){if(e.dead)continue;const dx=e.x-w.hx,dy=e.y-w.hy,dd=Math.hypot(dx,dy);
        if(dd>st.range+e.r)continue;let da=Math.abs(Math.atan2(dy,dx)-ang);if(da>Math.PI)da=TAU-da;
        if(da<0.75||dd<e.r+6){const kb=d.kb||40;hitEnemy(e,st.dmg,st.crit,ca*kb,sa*kb);}}
      break;}
    case 'gun':case 'rocket':{
      const sp=d.speed;G.proj.push({x:w.hx+ca*5,y:w.hy+sa*5,vx:ca*sp,vy:sa*sp,dmg:st.dmg,crit:st.crit,pierce:d.pierce||0,life:st.range/sp+0.1,spr:d.proj||'blaek',stun:d.stun,psn:d.psn,explode:d.boom,hit:new Set(),ang,spin:d.proj==='salmebog'});
      sfx('shoot');if(d.proj==='flash')fx({k:'ring',x:w.hx+ca*6,y:w.hy+sa*6,r0:1,r1:6,c:'#fffbe0',life:0.1});break;}
    case 'boomerang':{
      G.proj.push({x:w.hx,y:w.hy,vx:ca*d.speed,vy:sa*d.speed,dmg:st.dmg,crit:st.crit,pierce:99,boom:true,out:st.range/d.speed,life:5,spr:'haandjern',slow:d.slow,hit:new Set(),ang,spin:true});
      w.hidden=true;sfx('shoot');break;}
    case 'spray':{
      for(let i=0;i<d.count;i++){const a=ang+rand(-0.38,0.38),v=rand(140,190);
        G.proj.push({x:w.hx+ca*6,y:w.hy+sa*6,vx:Math.cos(a)*v,vy:Math.sin(a)*v,dmg:st.dmg,crit:st.crit,pierce:99,life:st.range/v,spr:'spray',hit:new Set(),ang:a,fade:true});}
      sfx('shoot');break;}
    case 'pulse':{
      fx({k:'ring',x:G.x,y:G.y,r0:6,r1:st.range,c:w.key==='klokke'?'#f2c94c':'#e8f4ff',life:0.3});
      sfx(w.key==='klokke'?'bong':'dodge');
      for(const e of G.enemies){if(e.dead)continue;const dx=e.x-G.x,dy=e.y-G.y,dd=Math.hypot(dx,dy)||1;if(dd<st.range+e.r){const kb=d.kb||20;hitEnemy(e,st.dmg,st.crit,dx/dd*kb,dy/dd*kb,{stun:d.stun});}}
      w.anim=1;break;}
    case 'aura':{
      for(let i=0;i<3;i++){const a=rand(0,TAU),r=rand(8,st.range);fx({k:'smoke',x:G.x+Math.cos(a)*r,y:G.y+Math.sin(a)*r,life:rand(0.5,0.9)});}
      for(const e of G.enemies){if(e.dead)continue;if(Math.hypot(e.x-G.x,e.y-G.y)<st.range+e.r)hitEnemy(e,st.dmg,st.crit,0,0);}
      break;}
    case 'beam':{
      const x2=w.hx+ca*st.range,y2=w.hy+sa*st.range;fx({k:'beam',x:w.hx,y:w.hy,x2,y2,life:0.14});sfx('shoot');
      for(const e of G.enemies){if(e.dead)continue;const t=clamp(((e.x-w.hx)*ca+(e.y-w.hy)*sa),0,st.range);const px=w.hx+ca*t,py=w.hy+sa*t;
        if(Math.hypot(e.x-px,e.y-py)<e.r+3)hitEnemy(e,st.dmg,st.crit,ca*15,sa*15);}
      w.anim=0.5;w.la=ang;break;}
  }
}
function updateWeapons(dt){
  const n=G.weapons.length;
  G.weapons.forEach((w,i)=>{
    const a=n===1?0.35:i/n*TAU-Math.PI/2;const rr=n===1?11:15;
    w.hx=G.x+Math.cos(a)*rr;w.hy=G.y+3+Math.sin(a)*rr*0.7;
    const d=WEAPONS[w.key],st=wStats(w);
    w.timer-=dt;w.anim=Math.max(0,w.anim-dt*5);
    const self=d.kind==='pulse'||d.kind==='aura';
    const ox=self?G.x:w.hx,oy=self?G.y:w.hy;
    const tgt=nearestEnemy(ox,oy,st.range);
    const look=tgt||nearestEnemy(ox,oy,400);
    let ta=look?Math.atan2(look.y-w.hy,look.x-w.hx):(G.face>0?0:Math.PI),da=ta-w.ang;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;w.ang+=da*Math.min(1,dt*(look?14:6));
    if(w.hidden)return;
    if(w.timer<=0&&tgt){fire(w,d,st,tgt);w.timer=st.cd;}
  });
}

function updatePassive(dt){

  if(G.ch.id==='seb'){

function eliteAI(e,dt){e.spawnT-=dt;if(e.spawnT<=0){e.spawnT=5;for(let i=0;i<5;i++)queueSpawn('poelse',e.x+rand(-40,40),e.y+rand(-40,40),0.6);}}

// ---------- update ----------
function inputVec(){
  let x=0,y=0;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))x-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))x+=1;
  if(keys.has('KeyW')||keys.has('ArrowUp'))y-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))y+=1;
  try{const gp=navigator.getGamepads&&navigator.getGamepads();if(gp)for(const p of gp){if(!p)continue;const ax=p.axes[0]||0,ay=p.axes[1]||0;if(Math.hypot(ax,ay)>0.2){x+=ax;y+=ay;}}}catch(e){}
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>3){x+=dx/Math.max(d,22);y+=dy/Math.max(d,22);}}
  const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}return{x,y};
}
function update(dt){
  const s=G.stats;
  if(!G.ended&&G.wave<20){G.time-=dt;if(G.time<=0){G.time=0;endWave();return;}}
  const v=inputVec();G.moving=Math.hypot(v.x,v.y)>0.05;
  const sp=85*Math.max(0.35,1+s.speed/100);
  G.x=clamp(G.x+v.x*sp*dt,B.x0,B.x1);G.y=clamp(G.y+v.y*sp*dt,B.y0,B.y1);
  if(Math.abs(v.x)>0.1)G.face=v.x>0?1:-1;if(G.moving)G.anim+=dt;
  G.inv=Math.max(0,G.inv-dt);G.stealCd-=dt;G.shake=Math.max(0,G.shake-dt);
  if(s.regen>0){G.regAcc+=s.regen*0.12*dt;while(G.regAcc>=1){G.regAcc-=1;heal(1);}}
  if(!G.ended){spawnTick(dt);sackTick(dt);}
  for(const m of G.marks){m.t-=dt;if(m.t<=0&&!G.ended)makeEnemy(m.type,m.x,m.y);}
  G.marks=G.marks.filter(m=>m.t>0);
  updatePassive(dt);updateWeapons(dt);updateTurrets(dt);updateDogs(dt);updateMotos(dt);
  const E=G.enemies;
  for(const e of E){
    if(e.dead)continue;e.t+=dt;e.flash-=dt;e.fcd=(e.fcd||0)-dt;e.slow-=dt;if(e.sayT>0)e.sayT-=dt;
    const D=ENEMIES[e.type]||{};
    if(e.psnT>0){e.psnT-=dt;e.psnAcc+=e.psnDps*dt;if(e.psnAcc>=1){const pd=Math.floor(e.psnAcc);e.psnAcc-=pd;e.hp-=pd;fx({k:'n',x:e.x,y:e.y-e.r-2,v:pd,c:'#7ccf5a',life:0.45});if(e.hp<=0){killEnemy(e);continue;}}}
    const dx=G.x-e.x,dy=G.y-e.y,d=Math.hypot(dx,dy)||1;let mvx=0,mvy=0;
    if(e.st==='under'){
      const tx=e.tx-e.x,ty=e.ty-e.y,td=Math.hypot(tx,ty)||1;e.ct-=dt;
      if(td<4||e.ct<=0){e.st='wind';e.ct=0.5;e.surf=true;}else{mvx=tx/td*150;mvy=ty/td*150;if(Math.random()<0.7)fx({k:'p',x:e.x+rand(-3,3),y:e.y+4,vx:rand(-20,20),vy:-25,c:'#7a5230',life:0.4,sz:1});}
    }
    else if(e.stun>0)e.stun-=dt;
    else if(e.st==='wind'){e.ct-=dt;if(e.ct<=0){
      if(e.surf){e.surf=false;e.immune=false;e.st='walk';e.ccd=D.burrow;fx({k:'ring',x:e.x,y:e.y,r0:3,r1:22,c:'#7a5230',life:0.3,thick:2});parts(e.x,e.y,['#7a5230','#a66d3b','#c8ccd8'],10,90);G.shake=Math.max(G.shake,0.1);sfx('drill');
        if(Math.hypot(G.x-e.x,G.y-e.y)<22+6)hurt(e.dmg+1);}
      else{e.st='charge';e.ct=0.45;const cs=e.boss?270:220;e.vx=dx/d*cs;e.vy=dy/d*cs;}}}
    else if(e.st==='charge'){mvx=e.vx;mvy=e.vy;e.ct-=dt;if(e.ct<=0){e.st='walk';e.ccd=e.elite?1.8:D.charge;if(e.elite){ring(e,12,85,'pinkslim',5);sfx('bong');}}}
    else{
      if(e.spd>0){let spd=e.spd*(e.slow>0?0.5:1),dir=1;if(D.keep&&d<D.keep)dir=-0.4;mvx=dx/d*spd*dir;mvy=dy/d*spd*dir;}
      if(D.shoot){e.shootT-=dt;if(e.shootT<=0&&d<(D.srange||200)){e.shootT=D.shoot*rand(0.85,1.15);enemyShoot(e,D,dx/d,dy/d);}}
      if(D.charge){e.ccd-=dt;if(e.ccd<=0&&d<(e.boss?230:160)){e.st='wind';e.ct=e.boss?0.4:0.6;}}
      if(D.burrow){e.ccd-=dt;if(e.ccd<=0&&d<280){e.st='under';e.immune=true;e.tx=G.x;e.ty=G.y;e.ct=1.8;sfx('drill');}}
      if(e.elite)eliteAI(e,dt);
      if(e.king)kingAI(e,dt);
    }
    e.x+=(mvx+e.kbx)*dt;e.y+=(mvy+e.kby)*dt;const kd=Math.exp(-dt*9);e.kbx*=kd;e.kby*=kd;
    e.x=clamp(e.x,B.x0,B.x1);e.y=clamp(e.y,B.y0,B.y1);
    if(!e.immune&&e.dmg>0&&Math.hypot(G.x-e.x,G.y-e.y)<e.r+6)hurt(e.dmg);
  }
  for(let i=0;i<E.length;i++){const a=E[i];if(a.dead||a.immune)continue;for(let j=i+1;j<E.length;j++){const b=E[j];if(b.dead||b.immune)continue;
    const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r-2;if(Math.abs(dx)>m||Math.abs(dy)>m)continue;const d=Math.hypot(dx,dy)||0.01;
    if(d<m){const p=(m-d)/2,ux=dx/d,uy=dy/d;const wa=a.neutral?0:a.boss||a.type==='printer'?0.05:1,wb=b.neutral?0:b.boss||b.type==='printer'?0.05:1;a.x-=ux*p*wa;a.y-=uy*p*wa;b.x+=ux*p*wb;b.y+=uy*p*wb;}}}
  for(const p of G.proj){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.spin)p.ang+=dt*14;
    if(p.boom){p.out-=dt;if(p.out<=0&&!p.ret){p.ret=true;p.hit.clear();}
      if(p.ret){const dx=G.x-p.x,dy=G.y-p.y,d=Math.hypot(dx,dy)||1;p.vx=dx/d*240;p.vy=dy/d*240;if(d<10){p.life=0;for(const w of G.weapons)if(w.key==='haandjern')w.hidden=false;}}}
    if(p.life>0)for(const e of E){if(e.dead||e.immune||p.hit.has(e))continue;if(Math.abs(e.x-p.x)>e.r+4||Math.abs(e.y-p.y)>e.r+4)continue;
      if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+3){
        if(p.explode){p.life=0;break;}
        p.hit.add(e);const sp=Math.hypot(p.vx,p.vy)||1;hitEnemy(e,p.dmg,p.crit,p.vx/sp*25,p.vy/sp*25,{stun:p.stun,slow:p.slow,psn:p.psn});
        if(p.spr==='flash')fx({k:'ring',x:p.x,y:p.y,r0:1,r1:7,c:'#fffbe0',life:0.12});
        p.pierce--;if(p.pierce<0){p.life=0;break;}}}
    if(p.x<B.x0-30||p.x>B.x1+30||p.y<B.y0-30||p.y>B.y1+30){if(p.boom)p.ret=true;else p.life=0;}
    if(p.life<=0&&p.explode&&!p.exploded){p.exploded=true;explode(p.x,p.y,p.explode,p.dmg,p.crit);}
  }
  for(const w of G.weapons)if(w.key==='haandjern'&&w.hidden&&!G.proj.some(p=>p.boom&&p.life>0))w.hidden=false;
  G.proj=G.proj.filter(p=>p.life>0);
  for(const p of G.eproj){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.spin)p.ang=(p.ang||0)+dt*10;if(Math.hypot(p.x-G.x,p.y-G.y)<7){hurt(p.dmg);p.life=0;}}
  G.eproj=G.eproj.filter(p=>p.life>0);
  for(const c of G.clouds){c.t+=dt;const k=Math.exp(-dt*1.4);c.vx*=k;c.vy*=k;c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.t>0.4&&Math.hypot(G.x-c.x,G.y-c.y)<c.r)hurt(c.dmg);}
  G.clouds=G.clouds.filter(c=>c.t<c.life);
  G.enemies=E.filter(e=>!e.dead);
  const pr=45+s.luck*0.2;
  for(const p of G.pick)if(p.k==='gacha'||p.k==='egacha')p.mag=p.mag||Math.hypot(G.x-p.x,G.y-p.y)<pr;
  for(const p of G.pick){
    const dx=G.x-p.x,dy=G.y-p.y,d=Math.hypot(dx,dy)||1;
    if(d<pr||p.mag){p.mag=true;p.x+=dx/d*280*dt;p.y+=dy/d*280*dt;}else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9;}
    if(d<9){p.got=true;if(p.k==='pant'){G.pant++;addXp(1);sfx('pick');}else if(p.k==='bajer'){heal(3);sfx('buy');}else{G.gachaQ.push(p.k==='egacha'?'elite':'normal');toast(p.k==='egacha'?'ELITE GACHA BALL!':'GACHA BALL!',1000);sfx('lvl');}}
  }
  G.pick=G.pick.filter(p=>!p.got);
  updateFx(dt);
}
function updateFx(dt){for(const f of G.fx){f.t+=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=120*dt;}else if(f.k==='smoke'){f.y-=12*dt;}}G.fx=G.fx.filter(f=>f.t<f.life);}

// ---------- wave flow ----------
function endWave(){
  if(state!=='play')return;
  for(const p of G.pick){if(p.k==='pant'){G.pant++;addXp(1);}else if(p.k==='gacha'||p.k==='egacha')G.gachaQ.push(p.k==='egacha'?'elite':'normal');}
  const hv=Math.max(0,G.stats.harvest);if(hv){G.pant+=hv;addXp(hv);}
  Object.assign(G,{enemies:[],eproj:[],marks:[],pick:[],proj:[],emotos:[],clouds:[],boss:null});
  for(const w of G.weapons)w.hidden=false;
  if(G.wave>=20){win();return;}
  if(G.wave>(SAVE.best[G.ch.id]||0)){SAVE.best[G.ch.id]=G.wave;save();}
  sfx('wave');
  afterWave();
  render();renderScreen();
}
function afterWave(){
  if(G.gachaQ.length){state='gacha';G.gachaItem=rollGacha(G.gachaQ[0]);return;}
  if(G.pendingLv>0){state='levelup';G.lvOpts=rollLv();G.lvTotal=G.pendingLv;}else openShop();
}
function pickItemOfTier(tier){
  for(let t=tier;t>=1;t--){const pool=ITEMS.filter(it=>it.tier===t);const it=weighted(pool,x=>x.owner);if(it&&(!it.owner||unlocked(it.owner)))return it;}
  return ITEMS[0];
}
function rollGacha(type){
  let t;if(type==='elite')t=Math.random()<0.6?4:3;else t=Math.min(3,tierRoll()+(Math.random()<0.5?1:0));
  return pickItemOfTier(t);
}
function applyItem(it){applyStats(it.st);G.items.push(it.id);
  if(it.fx==='moto')G.motoMul*=0.75;if(it.fx==='bless'){G.blessBonus+=3;G.blessMul*=0.8;}if(it.fx==='turret')G.extraTurret++;if(it.fx==='dog')G.extraDog++;
  if(it.fx==='sacks'){G.extraSacks++;G.sackMul*=1.5;}}
function rollLv(){const a=[...LVUP].sort(()=>Math.random()-0.5).slice(0,4);const mult=G.level>=12?2:G.level>=6?1.5:1;return a.map(([k,v])=>[k,Math.max(1,Math.round(v*mult))]);}
function applyStats(st,sign){for(const k in st)G.stats[k]+=st[k]*(sign||1);}
function gameOver(){state='over';if(G.wave-1>(SAVE.best[G.ch.id]||0)){SAVE.best[G.ch.id]=G.wave-1;save();}renderScreen();}
function win(){state='win';SAVE.best[G.ch.id]=20;if(G.ch.id==='mat'&&!SAVE.unlock.sig){SAVE.unlock.sig=true;G.newUnlock=true;}save();renderScreen();}

// ---------- shop ----------
const priceAt=b=>Math.round(b*(1+0.15*(G.wave-1)));
function tierRoll(){
  const L=1+G.stats.luck/100,w=G.wave+1;
  const t4=clamp((w-12)*0.02*L,0,0.15),t3=clamp((w-7)*0.04*L,0,0.35),t2=clamp((w-2)*0.07*L,0,0.6);
  const r=Math.random();return r<t4?4:r<t4+t3?3:r<t4+t3+t2?2:1;
}
function weighted(list,ownerOf){const ws=list.map(x=>{const o=ownerOf(x);if(o&&!unlocked(o))return 0;return o===G.ch.id?3:o?0.3:1;});let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<list.length;i++){if((r-=ws[i])<0)return list[i];}return list[0];}
function rollOffer(){
  if(Math.random()<0.45){const key=weighted(Object.keys(WEAPONS),k=>WEAPONS[k].owner);const tier=tierRoll();return{kind:'w',key,tier,price:priceAt(WEAPONS[key].price*TP[tier])};}
  const it=pickItemOfTier(Math.min(4,tierRoll()));return{kind:'i',id:it.id,price:priceAt(it.price)};
}
function openShop(){state='shop';G.rerolls=0;G.sel=-1;G.shop=G.shop.filter(o=>o&&o.locked&&!o.sold);while(G.shop.length<4)G.shop.push(rollOffer());}
const rerollCost=()=>Math.round(2+G.wave*1+G.rerolls*(2+Math.floor(G.wave/4)));
function canBuyWeapon(o){if(G.weapons.length<6)return true;return o.tier<4&&G.weapons.some(w=>w.key===o.key&&w.tier===o.tier);}

  const o=G.shop[i];if(!o||o.sold||G.pant<o.price)return;

    else G.weapons.push(mkW(o.key,o.tier));}
  else applyItem(ITEMS.find(x=>x.id===o.id));

function shadow(x,y,w){ctx.fillStyle='rgba(50,25,10,0.32)';x=Math.round(x);y=Math.round(y);w=Math.round(w);const l=Math.round(x-w/2);ctx.fillRect(l+1,y,w-2,1);ctx.fillRect(l,y+1,w,1);ctx.fillRect(l+1,y+2,w-2,1);}
function spr(n,x,y,o){o=o||{};const s=S[n];const img=o.flash?s.f:s.i;const sc=o.scale||1,w=s.w*sc,h=s.h*sc;const dx=Math.round(x-w/2),dy=Math.round(y-h/2);
  if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  if(o.flip){ctx.save();ctx.translate(dx+w,dy);ctx.scale(-1,1);ctx.drawImage(img,0,0,w,h);ctx.restore();}else ctx.drawImage(img,dx,dy,w,h);
  if(o.alpha!=null)ctx.globalAlpha=1;}
function sprRot(n,x,y,a,ax){const s=S[n];ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(a);if(Math.cos(a)<0)ctx.scale(1,-1);ctx.drawImage(s.i,-(ax==null?s.w/2:ax),-Math.floor(s.h/2));ctx.restore();}
function drawPlayer(cid,x,y,o){
  o=o||{};const s=S[cid];const bob=o.moving?(Math.floor(o.anim*8)%2):0;
  shadow(x,y+s.h/2-1,12);
  if(o.inv&&Math.floor(o.inv*20)%2===0)return;
  ctx.drawImage(s.i,Math.round(x-s.w/2),Math.round(y-s.h/2-bob));
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#120c16';ctx.fillRect(0,0,W,H);
  if(!G){renderTitleScene();return;}
  let cx=clamp(Math.round(G.x-W/2),0,AW-W),cy=clamp(Math.round(G.y-H/2),0,AH-H);
  if(G.shake>0){cx+=ri(-2,2);cy+=ri(-2,2);}
  ctx.setTransform(1,0,0,1,-cx,-cy);
  ctx.drawImage(FLOOR,0,0);
  for(const m of G.marks){if(Math.floor(m.t*10)%2)continue;ctx.fillStyle='#e5533d';const x=Math.round(m.x),y=Math.round(m.y);const r=m.type==='boss'||m.type==='elite'?6:3;for(let i=-r;i<=r;i++){ctx.fillRect(x+i,y+i,1,1);ctx.fillRect(x+i,y-i,1,1);}}
  // fart clouds (floor level)
  for(const c of G.clouds){const k=c.t/c.life;ctx.globalAlpha=0.55*(k<0.1?k*10:k>0.8?(1-k)*5:1);
    for(let i=0;i<7;i++){const a=i/7*TAU+c.t*0.8,r=c.r*0.55;const px=c.x+Math.cos(a)*r,py=c.y+Math.sin(a)*r*0.7;const sz=6+((i+Math.floor(c.t*4))%3);ctx.fillStyle=i%2?'#9ac85a':'#b8d870';ctx.fillRect(Math.round(px-sz/2),Math.round(py-sz/2),sz,sz);}
    ctx.fillStyle='#b8d870';ctx.fillRect(Math.round(c.x-5),Math.round(c.y-4),10,8);ctx.globalAlpha=1;}
  for(const p of G.pick){shadow(p.x,p.y+4,5);spr(p.k==='pant'?'pant':p.k==='bajer'?'bajerp':p.k,p.x,p.y-1+(p.k!=='pant'?Math.sin(performance.now()/200):0));}
  for(const f of G.fx)if(f.k==='smoke'){ctx.globalAlpha=0.5*(1-f.t/f.life);ctx.fillStyle='#e8e4dc';const r=2+f.t*4|0;ctx.fillRect(Math.round(f.x-r/2),Math.round(f.y-r/2),r,r);ctx.globalAlpha=1;}
  const ents=[];
  for(const e of G.enemies)ents.push({y:e.y+e.r,e});
  for(const t of G.turrets)ents.push({y:t.y+6,t});
  for(const m of G.motos)ents.push({y:m.y+6,m});
  for(const m of G.emotos)ents.push({y:m.y+6,m});
  for(const g of G.dogs)ents.push({y:g.y+4,g});
  ents.push({y:G.y+11,p:1});
  ents.sort((a,b)=>a.y-b.y);
  for(const o of ents){
    if(o.e){const e=o.e;const s=S[e.spr];const sc=e.scale||1;
      if(e.st==='under'||(e.surf&&e.st==='wind')){
        ctx.fillStyle='#5a3418';ctx.fillRect(Math.round(e.x-3),Math.round(e.y+2),7,2);ctx.fillStyle='#7a5230';ctx.fillRect(Math.round(e.x-1),Math.round(e.y+1),3,1);
        if(e.st==='wind'&&Math.floor(e.t*14)%2){ctx.fillStyle='#e5533d';for(let i=0;i<20;i++){const a=i/20*TAU;ctx.fillRect(Math.round(e.x+Math.cos(a)*22),Math.round(e.y+Math.sin(a)*16),1,1);}}
        continue;}
      shadow(e.x,e.y+s.h*sc/2-2,Math.max(8,s.w*sc*0.7));
      let frame=e.spr+(Math.floor(e.t*7)%2?'2':'');if(!S[frame])frame=e.spr;
      const jx=e.st==='wind'?ri(-1,1):0;
      const D=ENEMIES[e.type]||{};const bob=D.bob?Math.abs(Math.sin(e.t*8))*2:0;
      const flash=e.flash>0||(e.st==='wind'&&Math.floor(e.t*16)%2);
      spr(frame,e.x+jx,e.y-bob,{scale:sc,flash,flip:e.type!=='printer'&&!e.neutral&&G.x<e.x});
      if(e.big){ctx.fillStyle='#f2c94c';ctx.fillRect(Math.round(e.x-1),Math.round(e.y-s.h*sc/2-4),3,2);}
      if(e.psnT>0&&Math.floor(e.t*6)%2){ctx.fillStyle='#7ccf5a';ctx.fillRect(Math.round(e.x+e.r-2),Math.round(e.y-e.r),2,2);}
      if(e.stun>0){ctx.fillStyle='#fff6a0';const a=e.t*8;ctx.fillRect(Math.round(e.x+Math.cos(a)*5),Math.round(e.y-e.r-4),1,1);ctx.fillRect(Math.round(e.x-Math.cos(a)*5),Math.round(e.y-e.r-4),1,1);}
    }else if(o.t){const t=o.t;const s=S.a1;shadow(t.x,t.y+5,12);
      if(t.build<1){const h=Math.ceil(s.h*t.build);ctx.drawImage(s.i,0,s.h-h,s.w,h,Math.round(t.x-s.w/2),Math.round(t.y-s.h/2+(s.h-h)),s.w,h);
        ctx.fillStyle='#4fd1c5';ctx.fillRect(Math.round(t.x-6),Math.round(t.y-s.h/2+(s.h-h))-1,12,1);}
      else spr('a1',t.x+(t.kick?ri(-1,1):0),t.y);
    }else if(o.m){spr('moto',o.m.x,o.m.y,{flip:o.m.vx<0});}
    else if(o.g){const g=o.g;shadow(g.x,g.y+3,10);spr(g.moving&&Math.floor(g.t*10)%2?'hund2':'hund',g.x,g.y-(g.moving?Math.floor(g.t*10)%2:0),{flip:g.face<0});}
    else{drawPlayer(G.ch.id,G.x,G.y,{moving:G.moving,anim:G.anim,inv:G.inv});
      for(const w of G.weapons){if(w.hidden)continue;const d=WEAPONS[w.key];let x=w.hx,y=w.hy;
        if(d.kind==='melee'&&w.anim>0){const k=Math.sin(w.anim*Math.PI),r=wStats(w).range*0.55;x+=Math.cos(w.la)*k*r;y+=Math.sin(w.la)*k*r;}
        if(d.kind==='pulse'||d.kind==='aura')spr(w.key,x,y+Math.sin(performance.now()/300+w.hx)*1.5);
        else sprRot(w.key,x,y,(d.kind==='melee'&&w.anim>0)?w.la:w.ang,2);}
    }
  }
  for(const p of G.proj){if(p.fade)ctx.globalAlpha=clamp(p.life*3,0,1);if(p.spin||p.spr==='salmebog'||p.spr==='raket'||p.spr==='pil'||p.spr==='sproejteskud')sprRot(p.spr,p.x,p.y,p.ang);else spr(p.spr,p.x,p.y);ctx.globalAlpha=1;}
  for(const p of G.eproj){if(p.spin)sprRot(p.spr||'remoulade',p.x,p.y,p.ang||0);else spr(p.spr||'remoulade',p.x,p.y);}
  // speech bubbles
  for(const e of G.enemies){if(e.sayT>0&&e.say){const s=S[e.spr];bubble(e.say,e.x,e.y-s.h*(e.scale||1)/2-4);}}
  for(const f of G.fx){const k=f.t/f.life;
    if(f.k==='p'){ctx.fillStyle=f.c;ctx.fillRect(Math.round(f.x),Math.round(f.y),f.sz,f.sz);}
    else if(f.k==='n'){drawText(f.v,f.x,f.y-k*12,f.c);}
    else if(f.k==='ring'){const r=f.r0+(f.r1-f.r0)*k;ctx.globalAlpha=1-k;ctx.fillStyle=f.c;const n=Math.max(12,Math.round(r*1.6));for(let i=0;i<n;i++){const a=i/n*TAU;ctx.fillRect(Math.round(f.x+Math.cos(a)*r),Math.round(f.y+Math.sin(a)*r*0.8),f.thick||1,f.thick||1);}ctx.globalAlpha=1;}
    else if(f.k==='beam'){ctx.globalAlpha=1-k;ctx.strokeStyle='#fff6c8';ctx.lineWidth=k<0.4?3:1;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.k==='swipe'){ctx.globalAlpha=0.7*(1-k);ctx.fillStyle='#ffffff';for(let i=-4;i<=4;i++){const a=f.a+i*0.16;const r=f.r*(0.6+0.4*k);ctx.fillRect(Math.round(f.x+Math.cos(a)*r),Math.round(f.y+Math.sin(a)*r),2,1);}ctx.globalAlpha=1;}
  }
  ctx.setTransform(1,0,0,1,0,0);
  if(joy.on){ctx.globalAlpha=0.5;ctx.fillStyle='#ffffff';for(let i=0;i<24;i++){const a=i/24*TAU;ctx.fillRect(Math.round(joy.ox+Math.cos(a)*22),Math.round(joy.oy+Math.sin(a)*22),1,1);}
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),m=Math.min(d,22)/(d||1);ctx.fillRect(Math.round(joy.ox+dx*m-3),Math.round(joy.oy+dy*m-3),6,6);ctx.globalAlpha=1;}
  if(G.hp/maxHp()<0.3&&state==='play'){ctx.globalAlpha=0.18+0.1*Math.sin(performance.now()/150);ctx.fillStyle='#e5533d';ctx.fillRect(0,0,W,3);ctx.fillRect(0,H-3,W,3);ctx.fillRect(0,0,3,H);ctx.fillRect(W-3,0,3,H);ctx.globalAlpha=1;}
}

      <div class="row"><button class="btn ghost" data-act="reroll" ${G.pant<rc?'disabled':''}>RUL IGEN (${rc})</button><span class="spacer"></span><button class="btn" data-act="next">NÆSTE BØLGE ▸</button></div>
      <div class="panel"><h3>VÅBEN ${G.weapons.length}/6</h3><p class="muted" style="font-size:19px;margin:6px 0 10px">Klik et våben for at sælge det eller kombinere to ens.</p>
        <div class="inv">${Array.from({length:6},(_,i)=>{const w=G.weapons[i];return w?`<button class="slot tier${w.tier} ${G.sel===i?'sel':''}" data-act="selw" data-i="${i}" aria-label="${WEAPONS[w.key].name}"><img src="${iconURL(w.key)}" alt=""><span class="n">${TN[w.tier]}</span></button>`:`<div class="slot empty"></div>`;}).join('')}</div>${selHTML}
        <h3 style="margin-top:16px">GENSTANDE ${G.items.length}</h3>
        <div class="inv" style="margin-top:10px">${G.items.length?G.items.map(id=>{const it=ITEMS.find(x=>x.id===id);return `<div class="slot tier${it.tier}" title="${it.name}"><img src="${iconURL(itemIcon(it))}" alt="${it.name}"></div>`;}).join(''):'<span class="muted">Ingen endnu.</span>'}</div></div>
     </div>
     <div class="panel"><h3>${G.ch.name.toUpperCase()} · NIV ${G.level}</h3><div style="margin-top:10px">${statsHTML()}</div></div></div></div>`;
  }else if(state==='gacha'){
    const elite=G.gachaQ[0]==='elite',it=G.gachaItem,sell=Math.max(1,Math.round(priceAt(it.price)*0.4));
    h=`<div class="wrap" style="max-width:520px"><div class="panel center" style="display:flex;flex-direction:column;gap:16px">
      <h2>${elite?'ELITE GACHA BALL':'GACHA BALL'}</h2>
      <div class="ball"><img src="${iconURL(elite?'egacha':'gacha')}" alt=""></div>
      <div class="card" style="text-align:left;width:100%"><div class="head"><div class="icon tier${it.tier}"><img src="${iconURL(itemIcon(it))}" alt=""></div><div style="min-width:0"><div class="name">${it.name}</div><div class="kind"><span class="tiertxt${it.tier}">${TN[it.tier]}</span> · Genstand</div></div></div>${itemLines(it)}</div>
      <div class="row" style="justify-content:center"><button class="btn" data-act="gtake" autofocus>TAG DEN</button><button class="btn ghost" data-act="gsell">SÆLG +${sell} PANT</button></div>
      ${G.gachaQ.length>1?`<p class="muted">${G.gachaQ.length-1} bold${G.gachaQ.length>2?'e':''} mere</p>`:''}</div></div>`;
  }else if(state==='pause'){
    h=`<div class="wrap" style="max-width:640px"><div class="panel" style="display:flex;flex-direction:column;gap:14px"><h2>PAUSE</h2>${statsHTML()}
      <div class="row"><button class="btn" data-act="resume">FORTSÆT</button><button class="btn ghost" data-act="mute">${muted?'LYD TIL':'LYD FRA'}</button><span class="spacer"></span><button class="btn red" data-act="quit">AFSLUT</button></div></div></div>`;
  }else if(state==='over'||state==='win'){
    const wn=state==='win';
    h=`<div class="wrap" style="max-width:640px"><div class="panel center" style="display:flex;flex-direction:column;gap:16px">
      <h1 style="font-size:clamp(18px,4vw,30px)">${wn?'LEJLIGHEDEN<br>ER REDDET':'DRUKNET I<br>REMOULADE'}</h1>
      <p>${wn?`${G.ch.name} har besejret Bofælleskabet. Sebastian, Mathias og Mikkel er skilt ad igen, og der er nogenlunde ryddet op på trægulvet.`:`${G.ch.name} faldt i bølge ${G.wave}.`}</p>
      ${G.newUnlock?`<p class="unlock">NY KARAKTER LÅST OP: SIGNE, DYRLÆGE</p>`:''}
      <div class="row" style="justify-content:center;gap:24px"><span class="tag">NIV ${G.level}</span><span class="tag">${G.kills} DRAB</span><span class="tag">${G.weapons.length} VÅBEN</span></div>
      <div class="row" style="justify-content:center"><button class="btn" data-act="again">SPIL IGEN</button><button class="btn ghost" data-act="toSelect">SKIFT KARAKTER</button></div></div></div>`;
  }
  scr.innerHTML=h;paintChars();
  const f=scr.querySelector('[autofocus]');if(f)f.focus();
}
scr.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;audioOn();
  const a=b.dataset.act,i=+b.dataset.i;
  switch(a){
    case 'toSelect':state='select';G=null;showHUD(false);break;
    case 'toTitle':state='title';G=null;showHUD(false);break;
    case 'pick':if(unlocked(b.dataset.id))newGame(b.dataset.id);break;
    case 'again':newGame(lastChar);break;
    case 'lv':{const[k,v]=G.lvOpts[i];G.stats[k]+=v;if(k==='maxHp')G.hp+=v;G.pendingLv--;sfx('buy');if(G.pendingLv>0)G.lvOpts=rollLv();else openShop();break;}
    case 'buy':buy(i);return;
    case 'gtake':case 'gsell':{const it=G.gachaItem;if(a==='gtake')applyItem(it);else G.pant+=Math.max(1,Math.round(priceAt(it.price)*0.4));G.gachaQ.shift();sfx('buy');afterWave();break;}
    case 'lock':G.shop[i].locked=!G.shop[i].locked;break;
    case 'reroll':{const c=rerollCost();if(G.pant<c)return;G.pant-=c;G.rerolls++;G.shop=G.shop.map(o=>o.locked&&!o.sold?o:rollOffer());sfx('print');break;}
    case 'selw':G.sel=G.sel===i?-1:i;break;
    case 'sell':{const w=G.weapons[G.sel];if(!w||G.weapons.length<=1)return;G.pant+=Math.max(1,Math.round(priceAt(WEAPONS[w.key].price*TP[w.tier])*0.35));G.weapons.splice(G.sel,1);G.sel=-1;sfx('pick');break;}
    case 'merge':{const j=+b.dataset.j;const w=G.weapons[G.sel];w.tier++;G.weapons.splice(j,1);G.sel=-1;sfx('lvl');break;}
    case 'next':G.wave++;startWave();break;
    case 'resume':state='play';break;
    case 'mute':muted=!muted;break;
    case 'quit':state='title';G=null;showHUD(false);break;
  }
  renderScreen();
});

// ================= input =================
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)&&state==='play')e.preventDefault();
  keys.add(e.code);
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play'){state='pause';renderScreen();}else if(state==='pause'){state='play';renderScreen();}}
  if(e.code==='KeyM'){muted=!muted;if(state==='pause')renderScreen();}
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();joy.on=false;if(state==='play'){state='pause';renderScreen();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';renderScreen();}});
$('pauseBtn').addEventListener('click',()=>{if(state==='play'){state='pause';renderScreen();}});
const stage=$('stage');
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
stage.addEventListener('pointerdown',e=>{if(state!=='play'||e.pointerType==='mouse'||e.target.closest('button'))return;audioOn();const p=toGame(e);joy.on=true;joy.id=e.pointerId;joy.ox=joy.x=p.x;joy.oy=joy.y=p.y;});
addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;const p=toGame(e);joy.x=p.x;joy.y=p.y;});
addEventListener('pointerup',e=>{if(e.pointerId===joy.id)joy.on=false;});
addEventListener('pointercancel',e=>{if(e.pointerId===joy.id)joy.on=false;});

// ================= sizing & loop =================
function fit(){
  const aw=Math.max(200,innerWidth-32),ah=Math.max(120,innerHeight-24);
  let s=Math.min(aw/W,ah/H);s=s>=1?Math.floor(s):s;
  document.documentElement.style.setProperty('--s',s);
}
addEventListener('resize',fit);fit();
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;demoT+=dt;
  if(state==='play'&&G)update(dt);
  render();if(G&&!hud.hidden)updateHUD();
  requestAnimationFrame(loop);
}
renderScreen();requestAnimationFrame(loop);
window.__RK={S,get G(){return G},get state(){return state},newGame:c=>{newGame(c);renderScreen();},endWave,SAVE,render:renderScreen};
})();
</script>

</body></html>
